---
- name: reload systemd for heartbeat-watchdog
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart heartbeat-watchdog timer
  ansible.builtin.systemd:
    name: heartbeat-watchdog.timer
    state: restarted

- name: restart disk-space-watchdog timer
  ansible.builtin.systemd:
    name: disk-space-watchdog.timer
    state: restarted
