---
# Pinned versions, re-verified 2026-08-04 against upstream GitHub releases.
# Re-check these against current stable releases before re-running this role
# after a long gap — these move independently and fairly often.
flux_version: "2.8.8"
sops_version: "3.13.3"
helm_version: "4.2.3"
# kubectl-cnpg is the official CloudNativePG kubectl plugin — `kubectl cnpg
# psql <cluster> -n <ns>` for interactive Postgres access against any Cluster,
# which is why this platform builds no DB admin tooling of its own. Version
# tracks the operator's appVersion (chart 0.29.0 → 1.30.0); re-verified
# against https://github.com/cloudnative-pg/cloudnative-pg/releases as of
# 2026-08-10.
cnpg_plugin_version: "1.30.0"

# AWS CLI v2 — needed to exercise this platform's S3 endpoints (the SeaweedFS
# gateway behind ObjectStorage) directly from the host, without wiring
# credentials into a throwaway pod. Re-verified against
# https://github.com/aws/aws-cli/tags as of 2026-08-11: 2.36.21. Note aws-cli
# publishes tags only, no GitHub releases.
#
# Checksum is a literal sha256 rather than a checksums URL like every other
# tool here: AWS ships a detached PGP signature (<zip>.sig) and no checksums
# file, so there is nothing for get_url's checksum: to point at. Recompute on
# every version bump:
#   curl -sO https://awscli.amazonaws.com/awscli-exe-linux-x86_64-<ver>.zip
#   sha256sum awscli-exe-linux-x86_64-<ver>.zip
awscli_version: "2.36.21"

# Keyed by arch because the hash is arch-specific. Only x86_64 is populated —
# this is a single x86_64 host, and an aarch64 run should fail loudly on the
# undefined key rather than silently install unverified.
awscli_sha256_map:
  x86_64: "b665b24dae1ed70bc38ef03998570307a0363839196b564bf04f8d7502132b9a"
awscli_sha256: "{{ awscli_sha256_map[ansible_facts['architecture']] }}"

# kubectl. Tracks the cluster's Kubernetes minor, which is set by the pinned
# Talos version below rather than chosen here — see terraform/clusters/homelab.
# Re-verified against https://dl.k8s.io/release/stable-1.36.txt as of
# 2026-08-16: v1.36.3.
kubectl_version: "1.36.3"

# talosctl — the machine-level CLI for the node, and what replaces `ssh` on a
# machine with no shell. Pinned to the Talos version the cluster itself runs:
# the two are released together and the
# client/server skew window is narrow, so treat this as one version, not two.
# Re-verified against https://github.com/siderolabs/talos/releases as of
# 2026-08-16: v1.13.8 (2026-08-04), whose DefaultKubernetesVersion is 1.36.2
# (pkg/machinery/constants/constants.go at that tag). Bumping this pins a new
# Kubernetes default too — check terraform/ before assuming it's CLI-only.
talos_version: "1.13.8"

# Terraform owns VM + cluster lifecycle. Deliberately Terraform proper rather
# than OpenTofu: the state-confidentiality problem that argues for OpenTofu is
# solved differently here — the Talos PKI is generated out of band with
# `talosctl gen secrets` and SOPS-encrypted, so tfstate holds a *derived* copy
# rather than the authoritative one and D12's single root key survives.
# Re-verified against https://github.com/hashicorp/terraform/releases as of
# 2026-08-16: v1.15.8 (2026-07-08).
terraform_version: "1.15.8"

cli_tools_arch_map:
  x86_64: amd64
  aarch64: arm64
cli_tools_arch: "{{ cli_tools_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

# CloudNativePG names its release assets linux_x86_64 / linux_arm64, not the
# amd64 convention every other tool here uses — hence a second map rather than
# reusing cli_tools_arch.
cnpg_arch_map:
  x86_64: x86_64
  aarch64: arm64
cnpg_arch: "{{ cnpg_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

cli_tools_install_dir: /usr/local/bin
