---
# --- kubectl: pinned upstream release binary, checksum-verified ------------
# Pinned to the cluster's own minor rather than latest-stable: kubectl supports
# one minor of skew either way, so tracking the control plane keeps it inside
# that window by construction.

- name: Check installed kubectl version
  ansible.builtin.command: kubectl version --client
  register: kubectl_installed
  changed_when: false
  failed_when: false

- name: Determine whether kubectl needs (re)install
  ansible.builtin.set_fact:
    kubectl_needs_install: "{{ ('v' + kubectl_version) not in (kubectl_installed.stdout | default('')) }}"

- name: Download and checksum-verify kubectl binary
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/{{ cli_tools_arch }}/kubectl"
    dest: "{{ cli_tools_install_dir }}/kubectl"
    checksum: "sha256:https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/{{ cli_tools_arch }}/kubectl.sha256"
    mode: "0755"
  when: kubectl_needs_install

- name: Install age via apt
  ansible.builtin.apt:
    name: age
    state: present
    update_cache: true

# --- flux CLI: pinned GitHub release binary, checksum-verified -------------

- name: Check installed flux version
  ansible.builtin.command: flux version --client
  register: flux_installed
  changed_when: false
  failed_when: false

- name: Determine whether flux needs (re)install
  ansible.builtin.set_fact:
    flux_needs_install: "{{ flux_version not in (flux_installed.stdout | default('')) }}"

- name: Download and checksum-verify flux release tarball
  ansible.builtin.get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_linux_{{ cli_tools_arch }}.tar.gz"
    dest: "/tmp/flux_{{ flux_version }}_linux_{{ cli_tools_arch }}.tar.gz"
    checksum: "sha256:https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_checksums.txt"
    mode: "0644"
  when: flux_needs_install

- name: Extract and install flux binary
  ansible.builtin.unarchive:
    src: "/tmp/flux_{{ flux_version }}_linux_{{ cli_tools_arch }}.tar.gz"
    dest: "{{ cli_tools_install_dir }}"
    include: [flux]
    remote_src: true
    mode: "0755"
  when: flux_needs_install

# --- sops: pinned GitHub release binary, checksum-verified -----------------

- name: Check installed sops version
  ansible.builtin.command: sops --version
  register: sops_installed
  changed_when: false
  failed_when: false

- name: Determine whether sops needs (re)install
  ansible.builtin.set_fact:
    sops_needs_install: "{{ sops_version not in (sops_installed.stdout | default('')) }}"

- name: Download and checksum-verify sops binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.{{ cli_tools_arch }}"
    dest: "{{ cli_tools_install_dir }}/sops"
    checksum: "sha256:https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.checksums.txt"
    mode: "0755"
  when: sops_needs_install

# --- helm: pinned GitHub release binary, checksum-verified -----------------

- name: Check installed helm version
  ansible.builtin.command: helm version --short
  register: helm_installed
  changed_when: false
  failed_when: false

- name: Determine whether helm needs (re)install
  ansible.builtin.set_fact:
    helm_needs_install: "{{ ('v' + helm_version) not in (helm_installed.stdout | default('')) }}"

- name: Download and checksum-verify helm release tarball
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ cli_tools_arch }}.tar.gz"
    dest: "/tmp/helm-v{{ helm_version }}-linux-{{ cli_tools_arch }}.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ cli_tools_arch }}.tar.gz.sha256sum"
    mode: "0644"
  when: helm_needs_install

- name: Extract helm tarball
  ansible.builtin.unarchive:
    src: "/tmp/helm-v{{ helm_version }}-linux-{{ cli_tools_arch }}.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/linux-{{ cli_tools_arch }}/helm"
  when: helm_needs_install

- name: Install helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ cli_tools_arch }}/helm"
    dest: "{{ cli_tools_install_dir }}/helm"
    mode: "0755"
    remote_src: true
  when: helm_needs_install

# --- kubectl-cnpg: pinned GitHub release binary, checksum-verified ---------
# The CloudNativePG kubectl plugin. Installed as a plain binary named
# kubectl-cnpg on PATH, which is all kubectl's plugin mechanism needs for
# `kubectl cnpg ...` to work.

- name: Check installed kubectl-cnpg version
  ansible.builtin.command: kubectl-cnpg version
  register: cnpg_plugin_installed
  changed_when: false
  failed_when: false

- name: Determine whether kubectl-cnpg needs (re)install
  ansible.builtin.set_fact:
    cnpg_plugin_needs_install: "{{ cnpg_plugin_version not in (cnpg_plugin_installed.stdout | default('')) }}"

- name: Download and checksum-verify kubectl-cnpg release tarball
  ansible.builtin.get_url:
    url: "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{ cnpg_plugin_version }}/kubectl-cnpg_{{ cnpg_plugin_version }}_linux_{{ cnpg_arch }}.tar.gz"
    dest: "/tmp/kubectl-cnpg_{{ cnpg_plugin_version }}_linux_{{ cnpg_arch }}.tar.gz"
    checksum: "sha256:https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{ cnpg_plugin_version }}/cnpg-{{ cnpg_plugin_version }}-checksums.txt"
    mode: "0644"
  when: cnpg_plugin_needs_install

- name: Extract and install kubectl-cnpg binary
  ansible.builtin.unarchive:
    src: "/tmp/kubectl-cnpg_{{ cnpg_plugin_version }}_linux_{{ cnpg_arch }}.tar.gz"
    dest: "{{ cli_tools_install_dir }}"
    include: [kubectl-cnpg]
    remote_src: true
    mode: "0755"
  when: cnpg_plugin_needs_install

# --- awscli: pinned AWS-hosted zip, checksum-verified ----------------------
# The odd one out in this role. Every other tool here is a drop-in binary;
# AWS CLI v2 ships a bundle whose own installer lays out
# /usr/local/aws-cli/v2/<version> and symlinks aws + aws_completer into the
# bin dir. Hence unarchive + a command task rather than a single get_url.
#
# No arch map: AWS names its assets linux-x86_64 / linux-aarch64, which is
# ansible_facts['architecture'] verbatim on both — unlike the amd64/arm64 and
# CloudNativePG conventions that need the two maps in vars/main.yml.

- name: Check installed awscli version
  ansible.builtin.command: aws --version
  register: awscli_installed
  changed_when: false
  failed_when: false

- name: Determine whether awscli needs (re)install
  ansible.builtin.set_fact:
    awscli_needs_install: "{{ awscli_version not in (awscli_installed.stdout | default('')) }}"

- name: Install unzip (required by unarchive to extract the awscli bundle)
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
  when: awscli_needs_install

- name: Create versioned extract directory for the awscli bundle
  # Version-scoped so a stale /tmp/aws from an older bundle can never be the
  # thing that gets installed.
  ansible.builtin.file:
    path: "/tmp/awscli-{{ awscli_version }}"
    state: directory
    mode: "0755"
  when: awscli_needs_install

- name: Download and checksum-verify awscli bundle
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_facts['architecture'] }}-{{ awscli_version }}.zip"
    dest: "/tmp/awscli-exe-linux-{{ ansible_facts['architecture'] }}-{{ awscli_version }}.zip"
    checksum: "sha256:{{ awscli_sha256 }}"
    mode: "0644"
  when: awscli_needs_install

- name: Extract awscli bundle
  ansible.builtin.unarchive:
    src: "/tmp/awscli-exe-linux-{{ ansible_facts['architecture'] }}-{{ awscli_version }}.zip"
    dest: "/tmp/awscli-{{ awscli_version }}"
    remote_src: true
    creates: "/tmp/awscli-{{ awscli_version }}/aws/install"
  when: awscli_needs_install

- name: Run the awscli installer
  # --update makes this safe whether or not a previous version is present;
  # without it the installer hard-fails when an install already exists.
  ansible.builtin.command:
    cmd: >-
      /tmp/awscli-{{ awscli_version }}/aws/install --update
      --install-dir /usr/local/aws-cli
      --bin-dir {{ cli_tools_install_dir }}
  when: awscli_needs_install
  changed_when: true

# --- talosctl: pinned GitHub release binary, checksum-verified -------------
# Machine-level CLI for the node. The *only* tool in this role that is not
# about talking to Kubernetes or its data services — it talks to the machine
# underneath, over Talos's API on :50000, and it is what replaces `ssh` on a
# node that has no shell.

- name: Check installed talosctl version
  ansible.builtin.command: talosctl version --client
  register: talosctl_installed
  changed_when: false
  failed_when: false

- name: Determine whether talosctl needs (re)install
  ansible.builtin.set_fact:
    talosctl_needs_install: "{{ ('v' + talos_version) not in (talosctl_installed.stdout | default('')) }}"

- name: Download and checksum-verify talosctl binary
  ansible.builtin.get_url:
    url: "https://github.com/siderolabs/talos/releases/download/v{{ talos_version }}/talosctl-linux-{{ cli_tools_arch }}"
    dest: "{{ cli_tools_install_dir }}/talosctl"
    checksum: "sha256:https://github.com/siderolabs/talos/releases/download/v{{ talos_version }}/sha256sum.txt"
    mode: "0755"
  when: talosctl_needs_install

# --- terraform: pinned HashiCorp release zip, checksum-verified ------------
# Not a GitHub release: HashiCorp publishes to releases.hashicorp.com, and the
# SHA256SUMS file there keys on the zip's own filename, which is why this needs
# no special-casing unlike awscli's detached-signature-only distribution.

- name: Check installed terraform version
  ansible.builtin.command: terraform version
  register: terraform_installed
  changed_when: false
  failed_when: false

- name: Determine whether terraform needs (re)install
  ansible.builtin.set_fact:
    terraform_needs_install: "{{ ('v' + terraform_version) not in (terraform_installed.stdout | default('')) }}"

- name: Install unzip (required by unarchive to extract the terraform zip)
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
  when: terraform_needs_install

- name: Download and checksum-verify terraform release zip
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ cli_tools_arch }}.zip"
    dest: "/tmp/terraform_{{ terraform_version }}_linux_{{ cli_tools_arch }}.zip"
    checksum: "sha256:https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_SHA256SUMS"
    mode: "0644"
  when: terraform_needs_install

- name: Extract and install terraform binary
  ansible.builtin.unarchive:
    src: "/tmp/terraform_{{ terraform_version }}_linux_{{ cli_tools_arch }}.zip"
    dest: "{{ cli_tools_install_dir }}"
    include: [terraform]
    remote_src: true
    mode: "0755"
  when: terraform_needs_install
