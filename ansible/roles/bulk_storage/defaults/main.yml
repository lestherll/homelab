---
# /mnt/storage is a 931G 5400rpm spinning disk (ST1000LM035), mounted by UUID
# from /etc/fstab. Root is a 128G SSD. That asymmetry is the whole point of this
# role: it owns the layout of the big-but-slow disk, and only bulk, sequentially
# accessed data belongs on it. Latency-sensitive state (Postgres WAL, Prometheus
# TSDB) deliberately stays on the SSD — see docs/storage-tiering-notes.md.
bulk_storage_mount: /mnt/storage

# HDD-backed libvirt storage pool, holding the VM's `bulk` data disk image.
#
# This pool is defined by *this* role rather than host_prereqs on purpose. The
# assert above is the one remaining hardware assertion in the whole design, and
# it is load-bearing here: if /mnt/storage is not mounted when libvirt opens the
# bulk image, the image lands on the SSD — the exact failure the assert exists
# to prevent, in a new costume.
bulk_storage_libvirt_pool_name: homelab-bulk
bulk_storage_libvirt_pool_path: "{{ bulk_storage_mount }}/libvirt-images"
