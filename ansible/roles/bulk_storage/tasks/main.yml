---
# Everything below writes into {{ bulk_storage_mount }}. If the disk is NOT
# mounted there, that path is just a directory on the root filesystem — so the
# bulk disk image would be created successfully while quietly filling the very
# SSD this tier exists to drain, and a sparse image gives no warning as it
# grows. Fail loudly instead of silently doing the opposite of the intent.
#
# This is the only hardware assertion left anywhere in the design: below this
# role, nothing knows one disk from another.
- name: Assert the bulk disk is actually mounted
  ansible.builtin.assert:
    that:
      - ansible_mounts | selectattr('mount', 'equalto', bulk_storage_mount) | list | length > 0
    fail_msg: >-
      {{ bulk_storage_mount }} is not a mount point. Refusing to write to it —
      check /etc/fstab and `findmnt {{ bulk_storage_mount }}` before re-running.
    success_msg: "{{ bulk_storage_mount }} is mounted"

# --- HDD-backed libvirt pool for the VM's bulk data disk -------------------
# Guarded by the assert at the top of this role; see the comment on
# bulk_storage_libvirt_pool_path in defaults/main.yml for why it lives here
# rather than alongside the SSD pool in host_prereqs.

- name: Create the bulk libvirt pool directory
  ansible.builtin.file:
    path: "{{ bulk_storage_libvirt_pool_path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Define the bulk libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ bulk_storage_libvirt_pool_name }}"
    command: define
    xml: |
      <pool type='dir'>
        <name>{{ bulk_storage_libvirt_pool_name }}</name>
        <target><path>{{ bulk_storage_libvirt_pool_path }}</path></target>
      </pool>

- name: Start the bulk libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ bulk_storage_libvirt_pool_name }}"
    state: active

# Separate task for the same reason as the SSD pool in host_prereqs: virt_pool
# honours one action per invocation, and combining state with autostart applies
# only the state, silently.
- name: Autostart the bulk libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ bulk_storage_libvirt_pool_name }}"
    autostart: true
