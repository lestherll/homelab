---
# k3s needs ip_forward=1. It does NOT need swapoff, unlike vanilla kubeadm —
# no swap-related task here on purpose.
#
# The filename is now a misnomer and deliberately not renamed: libvirt's NAT
# network for the Talos VM needs this same sysctl, so the setting outlives k3s.
# Renaming the drop-in would leave the old file in place still setting it, which
# is worse than an inaccurate name.
- name: Enable net.ipv4.ip_forward via sysctl drop-in
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  register: k3s_sysctl_file

- name: Apply sysctl settings immediately
  ansible.builtin.command: sysctl --system
  when: k3s_sysctl_file.changed
  changed_when: true

# node-exporter's rapl collector reads /sys/class/powercap/intel-rapl:*/energy_uj
# to report host power draw. That one file is 0400 root:root while everything
# else in the zone is world-readable — it's the kernel's CVE-2020-8694 (PLATYPUS)
# mitigation, since unprivileged RAPL reads leak a power side-channel usable to
# infer AES keys. node-exporter runs as uid 65534, so the collector fails with
# EACCES (node_scrape_collector_success{collector="rapl"} 0, and a ~225us scrape
# duration: it fails immediately rather than after doing work).
#
# Granting read to one dedicated group is the narrow fix. The two obvious
# alternatives are both worse here:
#   - chmod 0444 re-exposes the side channel to every local process, which is
#     exactly what the kernel restricted.
#   - running node-exporter as root would work with no host change at all, but
#     that DaemonSet mounts host / at /host/root, so uid 0 would give a
#     network-listening service read access to /etc/shadow, the SOPS age key and
#     the k3s node token. readOnly: true stops writes, not reads.
# The pod side of this is securityContext.supplementalGroups in
# infrastructure/observability/helmrelease.yaml — both halves are required.
- name: Create the rapl group for reading powercap energy counters
  ansible.builtin.group:
    name: rapl
    gid: 600
    system: true

# Scoped to energy_uj on purpose. The `chmod -R g=u` pattern most RAPL exporter
# docs (scaphandre, kepler) reach for would also make constraint_*_power_limit_uw
# group-WRITABLE, handing this group the ability to set CPU power caps.
#
# KERNEL=="intel-rapl:*" deliberately matches the subzones (intel-rapl:0:0 core,
# :0:1 uncore, :0:2 dram) as well as the top-level package-0/psys zones: the rapl
# collector iterates every zone and one unreadable zone fails the whole collector,
# not just that zone. It does not match the parent "intel-rapl" device, which has
# no energy_uj anyway. $env{DEVPATH} is used rather than %k so the rule follows the
# real device path instead of the /sys/class symlink.
- name: Install udev rule granting the rapl group read on RAPL energy counters
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-rapl-energy.rules
    content: |
      SUBSYSTEM=="powercap", ACTION=="add|change", KERNEL=="intel-rapl:*", RUN+="/usr/bin/chgrp rapl /sys$env{DEVPATH}/energy_uj"
      SUBSYSTEM=="powercap", ACTION=="add|change", KERNEL=="intel-rapl:*", RUN+="/usr/bin/chmod g+r /sys$env{DEVPATH}/energy_uj"
    owner: root
    group: root
    mode: "0644"
  register: rapl_udev_rule

# udev only applies rules on events, so an installed rule does nothing to the
# zones that already exist. Trigger it explicitly rather than requiring a reboot.
- name: Reload udev rules and re-trigger the powercap subsystem
  ansible.builtin.command: "{{ item }}"
  loop:
    - udevadm control --reload
    - udevadm trigger --subsystem-match=powercap --action=change
  when: rapl_udev_rule.changed
  changed_when: true

# --- Hypervisor layer -----------------------------------------------------
# Ubuntu becomes a hypervisor; Terraform provisions a single Talos VM on top.
# See docs/talos-terraform-migration-notes.md for why this shape rather than
# re-imaging the host to bare-metal Talos.

- name: Install hypervisor packages
  ansible.builtin.apt:
    name: "{{ hypervisor_packages }}"
    state: present
    update_cache: true

- name: Ensure libvirtd is enabled and running
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started

# So the operator can run virsh/terraform against the system libvirt URI
# (qemu:///system) without sudo. Terraform's libvirt provider connects as the
# invoking user, so without this every apply would need root — and running
# Terraform as root would put tfstate's permissions somewhere inconvenient.
#
# Note this grants effective root: libvirt group members can define a domain
# that mounts anything. Acceptable on a single-user host where that user
# already has sudo; recorded so it isn't mistaken for a least-privilege grant.
- name: Add the operator to the libvirt group
  ansible.builtin.user:
    name: "{{ homelab_operator_user }}"
    groups: libvirt
    append: true

# The default 'default' network is NAT on 192.168.122.0/24 and autostarts.
# Left alone rather than deleted — it costs one bridge and removing it is the
# kind of change that surprises a future virt-install — but the Talos VM gets
# its own network so its addressing is ours to pin.
# CAVEAT: `command: define` CREATES but does not UPDATE. If the network already
# exists, libvirt rejects the redefinition ("network 'talos' already exists with
# uuid ...") and this task fails rather than converging — so editing the
# template above is not enough to change a live network. Renumbering is a
# deliberate two-step:
#
#   virsh -c qemu:///system net-destroy talos
#   virsh -c qemu:///system net-undefine talos
#   <re-run this role>
#
# Left as-is rather than papered over with a force flag: a network change
# invalidates the DHCP reservation the node depends on and requires the VM to
# be rebuilt, so failing loudly is the correct behaviour.
- name: Define the Talos libvirt network
  community.libvirt.virt_net:
    name: "{{ libvirt_talos_network_name }}"
    command: define
    xml: "{{ lookup('ansible.builtin.template', 'libvirt-network-talos.xml.j2') }}"

- name: Start the Talos libvirt network
  community.libvirt.virt_net:
    name: "{{ libvirt_talos_network_name }}"
    state: active

# Autostart matters more than it looks: §8 assumes unplanned reboots on
# domestic power, and a VM whose network did not come back is a cluster that
# did not come back.
- name: Autostart the Talos libvirt network
  community.libvirt.virt_net:
    name: "{{ libvirt_talos_network_name }}"
    autostart: true

# SSD-backed pool. The HDD-backed pool is deliberately NOT here — it lives in
# bulk_storage, behind that role's mount assert, because an unmounted
# /mnt/storage at image-creation time would silently put the bulk image on the
# SSD. host_prereqs has no business asserting anything about that disk.
- name: Create the SSD libvirt pool directory
  ansible.builtin.file:
    path: "{{ libvirt_ssd_pool_path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Define the SSD libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_ssd_pool_name }}"
    command: define
    xml: |
      <pool type='dir'>
        <name>{{ libvirt_ssd_pool_name }}</name>
        <target><path>{{ libvirt_ssd_pool_path }}</path></target>
      </pool>

- name: Start the SSD libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_ssd_pool_name }}"
    state: active

# Separate task, not folded into the one above: virt_pool honours one action
# per invocation, so `state: active` + `autostart: true` together silently
# applies only the state and leaves autostart off. Silently is the problem —
# there is no warning, and the failure surfaces one host reboot later as an
# inactive pool and a VM that will not start.
- name: Autostart the SSD libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_ssd_pool_name }}"
    autostart: true

- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

# Regression fix vs. the current podman stack: the kube-prometheus-stack chart's
# node-exporter DaemonSet runs with hostNetwork: true, which binds 0.0.0.0:9100 —
# exposed to the whole home LAN, not just the tailnet, unlike the current podman
# setup which binds only TAILSCALE_IP:9100. Scope it back down at the host firewall
# level rather than fighting the chart's networking model.
- name: Allow node-exporter port 9100 on the tailscale interface only
  community.general.ufw:
    rule: allow
    interface: "{{ tailscale_interface }}"
    direction: in
    port: "9100"
    proto: tcp
    comment: "node-exporter — tailnet only"

# The k3s API server binds 0.0.0.0:6443 by default. Scope it to the tailnet so
# kubectl/flux work from other tailscale devices (kubeconfig points at this
# host's tailscale IP, already a TLS SAN) without exposing the API to the LAN.
- name: Allow k3s API port 6443 on the tailscale interface only
  community.general.ufw:
    rule: allow
    interface: "{{ tailscale_interface }}"
    direction: in
    port: "6443"
    proto: tcp
    comment: "k3s API — tailnet only"

# sshd listens on all interfaces on this host already (confirmed via `ss -tlnp`)
# — kept open on all interfaces rather than scoped to tailscale0, so enabling
# ufw doesn't change how this host is reached today (LAN, tailnet, wherever).
- name: Allow SSH on all interfaces
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "ssh"

# ufw's own default is DEFAULT_FORWARD_POLICY="DROP", which conflicts with k3s's
# CNI (flannel): pod-to-pod and pod-to-internet traffic crosses the FORWARD chain
# via cni0/flannel.1, and a DROP-by-default policy there breaks it. Not a real
# segmentation loss — flannel doesn't enforce NetworkPolicy anyway (see k3s notes),
# so FORWARD-DROP was never providing real pod-level isolation, just breakage risk.
- name: Allow forwarded traffic by default (required for flannel/CNI)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw

# libvirt inserts its own ACCEPT rules for dnsmasq into its LIBVIRT_INP chain,
# which is jumped to from INPUT ahead of ufw's chains, so these two rules are
# usually redundant. They are here anyway because "usually" is doing real work
# in that sentence — rule ordering between ufw and libvirt has changed across
# releases, and the failure mode (a VM that boots but never gets a lease, so
# never becomes reachable for apply-config) reads like a Talos problem rather
# than a firewall one.
- name: Allow DHCP and DNS from the Talos VM network to the host
  community.general.ufw:
    rule: allow
    interface: "{{ libvirt_talos_network_bridge }}"
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "libvirt dnsmasq — Talos VM network only"
  loop:
    - {port: "53", proto: tcp}
    - {port: "53", proto: udp}
    - {port: "67", proto: udp}

# Enabling only after the SSH-allow and forward-policy tasks above, so there's
# no window where ufw is active without them.
- name: Enable ufw
  community.general.ufw:
    state: enabled
