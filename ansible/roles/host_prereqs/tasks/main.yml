---
# libvirt's NAT network routes the VM's traffic through the host, which needs
# ip_forward=1. Nothing here needs swapoff.
- name: Enable net.ipv4.ip_forward via sysctl drop-in
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-ip-forward.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  register: ip_forward_sysctl_file

# The setting previously lived in 99-k3s.conf. Removing that file matters: two
# drop-ins both setting ip_forward would leave the old one authoritative on
# alphabetical ties, so a future change to the file above could silently fail
# to take. Safe to delete unconditionally once this has run everywhere.
- name: Remove the superseded sysctl drop-in
  ansible.builtin.file:
    path: /etc/sysctl.d/99-k3s.conf
    state: absent
  register: old_sysctl_file

- name: Apply sysctl settings immediately
  ansible.builtin.command: sysctl --system
  when: ip_forward_sysctl_file.changed or old_sysctl_file.changed
  changed_when: true

# --- Hypervisor layer -----------------------------------------------------
# Ubuntu becomes a hypervisor; Terraform provisions a single Talos VM on top.
# See docs/talos-terraform-migration-notes.md for why this shape rather than
# re-imaging the host to bare-metal Talos.

- name: Install hypervisor packages
  ansible.builtin.apt:
    name: "{{ hypervisor_packages }}"
    state: present
    update_cache: true

- name: Ensure libvirtd is enabled and running
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started

# So the operator can run virsh/terraform against the system libvirt URI
# (qemu:///system) without sudo. Terraform's libvirt provider connects as the
# invoking user, so without this every apply would need root — and running
# Terraform as root would put tfstate's permissions somewhere inconvenient.
#
# Note this grants effective root: libvirt group members can define a domain
# that mounts anything. Acceptable on a single-user host where that user
# already has sudo; recorded so it isn't mistaken for a least-privilege grant.
- name: Add the operator to the libvirt group
  ansible.builtin.user:
    name: "{{ homelab_operator_user }}"
    groups: libvirt
    append: true

# The default 'default' network is NAT on 192.168.122.0/24 and autostarts.
# Left alone rather than deleted — it costs one bridge and removing it is the
# kind of change that surprises a future virt-install — but the Talos VM gets
# its own network so its addressing is ours to pin.
# CAVEAT: `command: define` CREATES but does not UPDATE. If the network already
# exists, libvirt rejects the redefinition ("network 'talos' already exists with
# uuid ...") and this task fails rather than converging — so editing the
# template above is not enough to change a live network. Renumbering is a
# deliberate two-step:
#
#   virsh -c qemu:///system net-destroy talos
#   virsh -c qemu:///system net-undefine talos
#   <re-run this role>
#
# Left as-is rather than papered over with a force flag: a network change
# invalidates the DHCP reservation the node depends on and requires the VM to
# be rebuilt, so failing loudly is the correct behaviour.
- name: Define the Talos libvirt network
  community.libvirt.virt_net:
    name: "{{ libvirt_talos_network_name }}"
    command: define
    xml: "{{ lookup('ansible.builtin.template', 'libvirt-network-talos.xml.j2') }}"

- name: Start the Talos libvirt network
  community.libvirt.virt_net:
    name: "{{ libvirt_talos_network_name }}"
    state: active

# Autostart matters more than it looks: §8 assumes unplanned reboots on
# domestic power, and a VM whose network did not come back is a cluster that
# did not come back.
- name: Autostart the Talos libvirt network
  community.libvirt.virt_net:
    name: "{{ libvirt_talos_network_name }}"
    autostart: true

# SSD-backed pool. The HDD-backed pool is deliberately NOT here — it lives in
# bulk_storage, behind that role's mount assert, because an unmounted
# /mnt/storage at image-creation time would silently put the bulk image on the
# SSD. host_prereqs has no business asserting anything about that disk.
- name: Create the SSD libvirt pool directory
  ansible.builtin.file:
    path: "{{ libvirt_ssd_pool_path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Define the SSD libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_ssd_pool_name }}"
    command: define
    xml: |
      <pool type='dir'>
        <name>{{ libvirt_ssd_pool_name }}</name>
        <target><path>{{ libvirt_ssd_pool_path }}</path></target>
      </pool>

- name: Start the SSD libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_ssd_pool_name }}"
    state: active

# Separate task, not folded into the one above: virt_pool honours one action
# per invocation, so `state: active` + `autostart: true` together silently
# applies only the state and leaves autostart off. Silently is the problem —
# there is no warning, and the failure surfaces one host reboot later as an
# inactive pool and a VM that will not start.
- name: Autostart the SSD libvirt storage pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_ssd_pool_name }}"
    autostart: true

- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

# Two rules from the k3s era that this role does not declare and no longer
# wants: 9100/tcp (node-exporter) and 6443/tcp (the k3s API), both on the
# tailnet interface. Both services moved INTO the guest at the Talos cutover,
# so they contradict the model stated in the comment block below — the host
# serves no cluster port at all.
#
# They were inert, not exposed: nothing on the host listened on either
# (`ss -tlnp`, 2026-08-30). Removing them anyway, for two reasons. They
# misreport the system to anyone reading `ufw status` during an incident, since
# "k3s API" names something that has not existed since the cutover. And they
# are pre-armed for a service that does not exist yet: the day a host-level
# node-exporter lands (LES-97, which the VM's empty /sys/class/powercap makes
# likely), :9100 would become tailnet-reachable with nobody having decided it.
#
# Declared rather than deleted by hand, following the superseded sysctl drop-in
# above: this role adds rules and never prunes them, so absence only becomes
# true by being stated. A hand-run `ufw delete` would leave the next person to
# add the rule back unopposed.
#
# Safe to delete this task once machine 1 has been rebuilt — a fresh host never
# has these rules, so it is a tombstone for one machine's history rather than a
# permanent part of the model. LES-157.
- name: Remove superseded k3s-era ufw rules
  community.general.ufw:
    rule: allow
    interface: "{{ tailscale_interface | default('tailscale0') }}"
    direction: in
    port: "{{ item }}"
    proto: tcp
    delete: true
  loop:
    - "9100"
    - "6443"

# NOTHING IN THE CLUSTER NEEDS A HOST INBOUND RULE. The Kubernetes API,
# node-exporter and every workload listen inside the guest, on a NAT'd network
# the LAN cannot route to at all — so the host firewall is not what protects
# them, and adding rules here for them would be theatre. Reaching them from
# another tailnet device goes through the guest's own Tailscale exposures.
#
# What remains is genuinely host-level: sshd, and letting the VM talk to
# libvirt's dnsmasq.

# sshd listens on all interfaces on this host already (confirmed via `ss -tlnp`)
# — kept open on all interfaces rather than scoped to tailscale0, so enabling
# ufw doesn't change how this host is reached today (LAN, tailnet, wherever).
- name: Allow SSH on all interfaces
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "ssh"

# ufw defaults DEFAULT_FORWARD_POLICY="DROP", which breaks the NAT network: the
# VM's traffic to the internet crosses the FORWARD chain via virbr-talos, and
# dropping it there leaves a VM that boots, takes its address, and can reach
# nothing — including the registries it needs to pull images. Costs no real
# segmentation, since the only thing being forwarded is this VM's own egress.
- name: Allow forwarded traffic by default (required for the VM's NAT egress)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw

# libvirt inserts its own ACCEPT rules for dnsmasq into its LIBVIRT_INP chain,
# which is jumped to from INPUT ahead of ufw's chains, so these two rules are
# usually redundant. They are here anyway because "usually" is doing real work
# in that sentence — rule ordering between ufw and libvirt has changed across
# releases, and the failure mode (a VM that boots but never gets a lease, so
# never becomes reachable for apply-config) reads like a Talos problem rather
# than a firewall one.
- name: Allow DHCP and DNS from the Talos VM network to the host
  community.general.ufw:
    rule: allow
    interface: "{{ libvirt_talos_network_bridge }}"
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "libvirt dnsmasq — Talos VM network only"
  loop:
    - {port: "53", proto: tcp}
    - {port: "53", proto: udp}
    - {port: "67", proto: udp}

# Enabling only after the SSH-allow and forward-policy tasks above, so there's
# no window where ufw is active without them.
- name: Enable ufw
  community.general.ufw:
    state: enabled
