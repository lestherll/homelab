---
# Converges the host into declared state. Not fresh-OS provisioning — Tailscale
# (already installed and running) is left untouched by every role.
#
# This playbook owns the METAL ONLY: packages, firewall, libvirt networks and
# storage pools, and the operator's CLI tools. It stops at the point where a VM
# can be created. Everything above that line — the VM itself, the cluster on it,
# and the workloads in that cluster — belongs to terraform/ and Flux, and
# nothing here should grow to reach into them.
#
# Note sudo, not -K: this host's sudo-rs doesn't match Ansible's become-prompt
# regex. See the comment block in ansible.cfg.
#
#   sudo ansible-playbook -i ansible/inventory/hosts.ini \
#     ansible/playbooks/converge.yml --tags host_prereqs,bulk_storage,cli_tools
#
# heartbeat_watchdog is tagged separately because it hard-fails until a real
# ntfy_topic replaces the placeholder in inventory/hosts.ini.
- name: Converge homelab host
  hosts: homelab
  become: true
  roles:
    - role: host_prereqs
      tags: [host_prereqs]
    # After host_prereqs, which defines the SSD pool: this role defines the
    # HDD-backed pool, and its mount assert is what stops that pool being
    # created on the SSD when /mnt/storage isn't mounted.
    - role: bulk_storage
      tags: [bulk_storage]
    - role: cli_tools
      tags: [cli_tools]
    - role: heartbeat_watchdog
      tags: [heartbeat_watchdog]

