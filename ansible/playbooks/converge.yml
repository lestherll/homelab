---
# Converges the existing host into declared state. Not fresh-OS provisioning —
# Tailscale (already installed and running) is left untouched by every role.
#
# Cutover step 1 (installs k3s alongside the still-running podman stack):
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/converge.yml -K \
#     --tags host_prereqs,cli_tools,k3s_server
#
# Cutover step 11 (once Alertmanager's tailnet Ingress is live — set ntfy_topic
# in inventory/hosts.ini first):
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/converge.yml -K \
#     --tags heartbeat_watchdog
- name: Converge homelab host
  hosts: homelab
  become: true
  roles:
    - role: host_prereqs
      tags: [host_prereqs]
    # Ahead of k3s_server: the local-path-bulk StorageClass provisions into a
    # directory this role creates, and the assert here is the guard against
    # writing bulk data onto the SSD when the disk isn't mounted.
    - role: bulk_storage
      tags: [bulk_storage]
    - role: cli_tools
      tags: [cli_tools]
    - role: k3s_server
      tags: [k3s_server]
    - role: heartbeat_watchdog
      tags: [heartbeat_watchdog]

