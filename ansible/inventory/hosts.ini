[homelab]
homelab-01 ansible_connection=local ansible_host=127.0.0.1

[homelab:vars]
# The human operator whose ~/.kube/config gets the k3s kubeconfig (k3s_server
# role). Deliberately explicit rather than inferred from the connection's own
# identity: this playbook may be invoked either as a normal user relying on
# per-task become, or wrapped in a single top-level `sudo` (see ansible.cfg's
# become_flags comment for why, on this sudo-rs host) — in the latter case the
# connection user is root, which would otherwise misdirect kubeconfig placement.
homelab_operator_user=lestherll

# Tailscale IP of this host on tailnet tailf4742d.ts.net.
# Used for k3s tls-san and to scope node-exporter's ufw rule to the tailscale0 interface.
tailscale_ip=100.121.11.84
tailscale_interface=tailscale0

# Used by heartbeat_watchdog (deployed at cutover step 11, once Alertmanager's
# tailnet Ingress actually exists — not part of the initial k3s bootstrap run).
alertmanager_healthy_url=https://alertmanager.tailf4742d.ts.net/-/healthy
# CHANGEME before deploying heartbeat_watchdog: generate a private, unguessable
# ntfy.sh topic (e.g. `openssl rand -hex 16`) — do not use a guessable name,
# anyone who knows the topic can read and post to it.
ntfy_topic=CHANGEME-generate-a-private-unguessable-topic
