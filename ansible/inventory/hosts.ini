[homelab]
# Reached over SSH like every other host — no `ansible_connection=local`
# special case, which is what makes the control node interchangeable
# (docs/fleet/fleet-provisioning-design-notes.md §9). MagicDNS FQDN rather
# than the short name: the short form resolves only via the control node's
# search domain, which is a property of that machine and not of this repo.
homelab-01 ansible_host=homelab.tailf4742d.ts.net ansible_user=lestherll

[homelab:vars]
# The human operator who gets added to the libvirt group, so virsh and
# terraform work against qemu:///system without sudo. Deliberately explicit
# rather than inferred from the connection's own identity: this playbook may be
# invoked either as a normal user relying on per-task become, or wrapped in a
# single top-level `sudo` (see ansible.cfg's become_flags comment for why, on
# this sudo-rs host) — in the latter case the connection user is root, and the
# group would land on the wrong account.
homelab_operator_user=lestherll

# Tailscale IP of this host on tailnet tailf4742d.ts.net. The host is the only
# thing on the tailnet: the VM sits behind NAT and reaches the tailnet through
# its own in-cluster Tailscale exposures, not through this address.
tailscale_ip=100.121.11.84
tailscale_interface=tailscale0

# Used by heartbeat_watchdog, which is deployed only once Alertmanager's tailnet
# Ingress actually exists.
alertmanager_healthy_url=https://alertmanager.tailf4742d.ts.net/-/healthy
# The libvirt domain name the Talos cluster VM runs as — must match
# `cluster_name` in terraform/clusters/homelab/main.tf, since that value
# becomes the libvirt_domain resource's `name`. Lets the watchdog tell "VM is
# down" apart from "VM is up but the cluster inside it is sick" (LES-98).
libvirt_domain_name=homelab

# Host-level free-space warning threshold for disk-space-watchdog (LES-102).
# Sparse VM images make `df` inside the guest lie about how much room is
# actually left on the host, so this has to be checked on the host itself.
disk_space_warn_threshold_percent=85
# ntfy_topic itself lives SOPS-encrypted at
# ansible/inventory/group_vars/homelab/ntfy_topic.sops.yaml (repo is public;
# a plaintext ntfy.sh topic here would let anyone post fake/suppress real
# heartbeat alerts). Edit with:
#   sops ansible/inventory/group_vars/homelab/ntfy_topic.sops.yaml
# Generate a fresh one with `openssl rand -hex 16` — private and unguessable,
# never a literal "CHANGEME".
