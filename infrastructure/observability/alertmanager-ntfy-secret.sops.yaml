# The ntfy endpoint Alertmanager posts critical alerts to.
#
# ONLY the URL lives here. The routing that decides what gets sent — which
# severities, what is suppressed, how often it repeats — stays in plain sight in
# helmrelease.yaml, because that is the part worth reviewing in a diff. This
# file exists solely because the repo is public and a plaintext ntfy.sh topic is
# a write credential: anyone who knows it can post fake alerts to the operator's
# phone, or drown real ones.
#
# DELIBERATE DUPLICATION. The same topic is also stored, separately encrypted,
# at ansible/inventory/group_vars/homelab/ntfy_topic.sops.yaml for the host
# heartbeat watchdog. One value, two copies, on opposite sides of the
# Ansible/Flux boundary — a single source would have to be readable by both a
# host-level Ansible run and an in-cluster Flux reconcile, which is real work
# for a value that changes approximately never. The cost is named rather than
# hidden: ROTATING THE TOPIC MEANS EDITING BOTH FILES, and missing one leaves
# either the host or the cluster shouting into a topic nobody is subscribed to.
