# Re-verify current chart version at implementation time (plan §7 — this chart
# moves roughly weekly). Verified against ArtifactHub as of 2026-08-04: 86.1.0.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        # Deliberate reduction from the current podman stack's 30d, to fit
        # D7's ~20%/~3GB budget with headroom for Loki's later addition.
        retention: 15d
        # retention (time) alone does not bound disk use, and the 10Gi below is
        # decorative: the provisioner hands out a plain hostPath directory with
        # no quota, so `df` inside the pod reports the whole `fast` filesystem.
        # Left unbounded, a cardinality spike fills that volume and every other
        # durable claim on it rather than dropping the oldest blocks. Set below
        # the claim so Prometheus compacts against its own limit first.
        #
        # 8GiB against a 20 GiB volume shared with Postgres and the SeaweedFS
        # filer is the tightest this number has been — it was sized when the
        # backing disk was a 106G SSD. Revisit it, not the volume, if the tier
        # gets crowded.
        retentionSize: 8GiB
        # Re-sized 2026-08-12, after the kubelet cardinality drop halved active
        # series (155,621 -> 80,475). Memory tracks head series, so the old
        # 1400Mi was sized against a TSDB that no longer exists: observed
        # ceiling is now 607Mi (max over 2h, post-compaction — the 761Mi max
        # over 8h spans the pre-compaction head and isn't representative).
        # 1024Mi is ~1.7x that.
        #
        # CPU limit raised despite usage *falling* to 59m: average is
        # misleading here because the work is bursty (scrape, rule eval,
        # compaction), and at 500m the container was throttled in 17.4% of its
        # CFS periods. Throttling a bursty workload stretches wall-clock time
        # without showing up as high average usage — the same trap as
        # node-exporter below, just less severe.
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { cpu: 750m, memory: 1024Mi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              # `fast`, not `scratch`, and this is the one observability claim
              # where the tier is a real decision rather than a rename. Two
              # reasons: an 8GiB TSDB does not belong on a 20 GiB system disk it
              # would share with etcd and every containerd layer, and `fast`
              # being a fixed-size volume means a cardinality spike fills 20 GiB
              # and stops instead of taking the node down. That it also survives
              # a VM rebuild is a welcome side effect, not the reason.
              storageClassName: fast
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Ships power metrics to the long-term store (infrastructure/
        # victoria-metrics), because the `retention: 15d` above is global and
        # energy-cost tracking spans billing periods. Nothing else here changes:
        # Prometheus remains the primary store for everything, this is a copy of
        # a handful of series that need to outlive its window.
        #
        # The writeRelabelConfigs filter is NOT optional. remoteWrite's default
        # is to ship EVERY series — without the keep rule this would put a second
        # full copy of a ~64k-series TSDB onto a 5400rpm disk. Extend the regex
        # when a new metric genuinely needs multi-year retention (e.g. wall-power
        # metrics from a metering smart plug), not by relaxing it.
        #
        # Note node_rapl_* is CPU package + DRAM only, not whole-system power —
        # see LES-85 before building cost panels on it.
        remoteWrite:
          - url: http://vm-longterm.observability.svc.cluster.local:8428/api/v1/write
            name: vm-longterm
            writeRelabelConfigs:
              - sourceLabels: [__name__]
                regex: "node_rapl_.*"
                action: keep

    alertmanager:
      alertmanagerSpec:
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 100m, memory: 128Mi }
        storage:
          volumeClaimTemplate:
            spec:
              # Silences and notification state. Small, and cheap to lose — the
              # alert rules themselves come from the chart, so a rebuild costs
              # at most a re-silence.
              storageClassName: scratch
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi

    grafana:
      admin:
        existingSecret: grafana-admin
      # The long-term store, as a second datasource. Panels spanning more than
      # the 15d Prometheus window — i.e. every meaningful energy-cost panel —
      # must select this one; short-range/live panels can use either.
      #
      # additionalDataSources is the chart's own hook for this: it renders into
      # the kube-prometheus-stack-grafana-datasource ConfigMap, which the
      # datasource sidecar then provisions into Grafana. That sidecar is enabled
      # by chart default (as is the dashboards one, which is set explicitly
      # below) — so nothing extra needs turning on, and unlike dashboards this
      # needs no labelled ConfigMap of its own under dashboards/.
      additionalDataSources:
        - name: VictoriaMetrics
          uid: vm-longterm
          # VictoriaMetrics implements the Prometheus query API, so the stock
          # Prometheus datasource type works — no plugin needed (which also
          # matters because plugin installs would need egress at pod start).
          type: prometheus
          access: proxy
          isDefault: false
          url: http://vm-longterm.observability.svc.cluster.local:8428
          jsonData:
            # Matches the scrape interval these series are written at, so
            # Grafana's auto-step doesn't request finer resolution than exists.
            timeInterval: 30s
      sidecar:
        dashboards:
          enabled: true
        # The two sidecars ship with no requests or limits at all, so they were
        # invisible to D7's ~3GB observability budget while actually holding
        # ~154Mi between them. They are ConfigMap watchers — steady-state RSS,
        # no growth path — so bounding them is about making the budget sum
        # honest, not about constraining them.
        #
        # Corrected 2026-08-12: the first attempt sized these off a single spot
        # reading (78Mi/76Mi) taken minutes after a restart, which undershot.
        # Real ceilings over 8h are 95Mi and 93Mi — 74% and 72% of the 128Mi
        # first set — and sc-dashboard was throttled in 54.5% of its CFS
        # periods against the 50m CPU limit. Sizing a just-restarted process is
        # how you get this wrong; use max_over_time, not `kubectl top`.
        resources:
          requests: { cpu: 10m, memory: 96Mi }
          limits: { cpu: 200m, memory: 192Mi }
      # Without this, /var/lib/grafana (dashboards, users, prefs) is an emptyDir
      # — wiped on every pod restart/reschedule. type: pvc matches this chart's
      # default single-replica Deployment mode (the chart's own commented
      # example uses type: sts, which is only for multi-replica StatefulSet mode).
      persistence:
        enabled: true
        type: pvc
        # Grafana's sqlite DB: users, prefs, and any dashboard edited in the UI
        # rather than committed. Dashboards proper are provisioned from labelled
        # ConfigMaps under dashboards/, so they are unaffected by losing this.
        storageClassName: scratch
        accessModes: ["ReadWriteOnce"]
        size: 1Gi
      # 256Mi was enough for classic Grafana but Grafana 13's unified-storage
      # layer (dashboard-service watch loop + bleve-backend in-memory search
      # indexes) pushes steady-state RSS past that, causing periodic OOMKills
      # (observed: container OOMKilled at 312Mi actual usage, GOMEMLIMIT
      # derived from the old 256Mi limit made it worse, not better).
      # Bumped again 2026-08-10: the 512Mi/200m limits from the first fix were
      # themselves exhausted once the CloudNativePG + SeaweedFS dashboards
      # (D15) landed — observed steady-state at 200m/200m CPU (fully
      # throttled) and 501Mi/512Mi memory, with live liveness/readiness probe
      # failures and a prior OOMKill-shaped restart. New limits sized for
      # ~1.5x that steady-state, and still comfortably inside D7's ~3GB
      # observability budget (CONCEPT.md) alongside Prometheus/Alertmanager.
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { cpu: 300m, memory: 768Mi }

    # Control-plane component monitors: all off. On k3s these never scraped
    # anything — no kube-system services for them exist, so the jobs had no
    # targets and the series arrived (and were dropped) via the kubelet's
    # combined registry instead. On Talos they CANNOT scrape anything: Talos
    # serves etcd/scheduler/controller-manager metrics behind its own PKI,
    # not reachable with in-cluster credentials. Nothing is lost either way —
    # no rule or dashboard here joins on those jobs.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 50m, memory: 64Mi }

    prometheus-node-exporter:
      # Both are the chart's defaults, set explicitly for documentation.
      #
      # hostNetwork was RECONSIDERED at the Talos cutover and deliberately KEPT.
      # Its old justification is indeed gone: it used to bind 0.0.0.0:9100 on
      # the bare-metal host, a regression that host_prereqs's ufw rule fenced
      # off. There is no ufw inside the guest. But the exposure it was fencing
      # is gone too — the VM sits on a NAT'd libvirt network with no inbound
      # route from anywhere but the host, so :9100 is not reachable off-box at
      # all.
      #
      # Turning it off was the alternative and was rejected as an unforced risk:
      # /proc/net is per-network-namespace (it resolves through /proc/self/net
      # regardless of the host /proc bind mount), so a non-hostNetwork
      # node-exporter reports the POD's interfaces rather than the node's, and
      # the netdev/netclass collectors — precisely the ones the 500m limit below
      # was sized for — would silently start describing the wrong netns. Losing
      # network metrics to buy back a port that is already unreachable is a bad
      # trade.
      #
      # NOTE: what this DaemonSet now calls "the host" is the VM, not the
      # metal. Everything below /host is the guest's view.
      hostNetwork: true
      hostPID: true
      # CPU limit raised 50m -> 500m, 2026-08-12. The 50m above was the chart's
      # default, adopted here "for documentation" without ever being measured
      # against this host — and that host had ~20 network interfaces (veths,
      # cni0, flannel.1, tailscale0) for the netclass collector to walk.
      #
      # That interface count is a guest-side question after cutover: tailscale0
      # stays on the metal (Tailscale is host-only by decision) and the bridge
      # is different, so the walk is probably cheaper. 500m is kept as the safe
      # direction to be wrong in — over-provisioning a 6%-of-box limit costs
      # nothing, and the failure mode below is what under-provisioning looks
      # like. Re-measure before trimming it.
      #
      # At 50m the container got a 5% duty cycle and was throttled in 85.5% of
      # its CFS periods. A ~194ms scrape (3.87s wall x 0.05 duty) stretched to
      # ~4s, occasionally past the 10s global scrape_timeout — which is what
      # the 10.009s max scrape duration and the 98.75% 24h availability
      # actually were: failed scrapes, not a slow exporter. The liveness probe
      # (timeoutSeconds: 1, against the *static* / page) landed inside those
      # throttled windows and couldn't get enough CPU to answer, producing the
      # recurring Unhealthy events and eventual SIGTERM restarts.
      #
      # Diagnosis note for next time: every collector reporting a near-
      # identical ~4s was the tell. One slow collector looks like one outlier;
      # uniform slowness across all of them is a shared constraint, i.e. the
      # cgroup. Average CPU (6.7m) looks harmless and hides this completely.
      #
      # 500m lets the same 194ms of work finish in ~390ms, inside both the 1s
      # probe timeout and the 10s scrape timeout, and is 6% of this 8-core box.
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 500m, memory: 32Mi }
      # INERT AFTER CUTOVER, and kept deliberately. /sys/class/powercap exists
      # inside the guest but is EMPTY — verified 2026-08-16 against the running
      # Talos VM, where the host has intel-rapl:0/:1 plus subzones. RAPL is not
      # virtualised, so no supplementary group can rescue it and
      # node_scrape_collector_success{collector="rapl"} will read 0. That is
      # accepted, not a bug to chase: relocating node-exporter to the metal is
      # LES-97, deferred by decision, and this key is what LES-97 needs back.
      # Do not "clean it up" in the meantime.
      #
      # Lets the rapl collector read /sys/class/powercap/intel-rapl:*/energy_uj
      # for host power metrics. That file is 0400 root:root (the kernel's
      # CVE-2020-8694/PLATYPUS mitigation), so as uid 65534 the collector was
      # failing EACCES on every scrape. GID 600 is the `rapl` group created by
      # host_prereqs, which also installs the udev rule that chgrps the counters
      # to it — this key alone does nothing without that half.
      #
      # This is a supplementary group rather than fsGroup on purpose: fsGroup
      # relabels volume ownership, which is a no-op on sysfs. Supplementary
      # groups are what the kernel actually checks on the bind-mounted file.
      #
      # Deliberately NOT runAsUser: 0, which would have needed no host change at
      # all. This DaemonSet mounts host / at /host/root, so root here means a
      # network-listening service can read /etc/shadow, the SOPS age key and the
      # k3s node token. The whole point is one extra group, not one extra root.
      securityContext:
        supplementalGroups: [600]

    prometheusOperator:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 200m, memory: 256Mi }

    kubelet:
      serviceMonitor:
        # 10s is the chart's default, chosen to match the kubelet's own cAdvisor
        # housekeeping interval so no update is missed. Dropped to 30s to match
        # every other target here: at 10s this endpoint was 13% of total ingest
        # (359 of 2,783 samples/sec) off only 3,593 samples per scrape — cost
        # driven purely by frequency, not by how much it returns.
        #
        # The tradeoff is real but narrow. Counters (container CPU, network
        # bytes) lose nothing: rate() over a window is exact regardless of how
        # often a monotonic counter is sampled. What degrades is gauges —
        # container_memory_working_set_bytes is now observed 1-in-3 as often,
        # so brief memory spikes can pass unseen. That matters here more than
        # it looks: this repo has twice used container memory metrics to
        # diagnose Grafana OOMKills. If a future OOM investigation comes up
        # short on resolution, this is the line to revisit.
        cAdvisorInterval: 30s
        # The `(apiserver|etcd)_.*` drop that used to sit here is GONE, and it
        # must not be reinstated on Talos. It existed because k3s ran the
        # apiserver, controller-manager, scheduler and kubelet in ONE process
        # sharing one Prometheus registry, so the kubelet's :10250/metrics
        # served that whole registry and every apiserver_*/etcd_* series was
        # stored twice — once under job="apiserver" and again under
        # job="kubelet". Measured 2026-08-12: 79,694 of 148,366 total series
        # came from job="kubelet", and only 4,906 of those were genuinely
        # kubelet/container metrics. Dropping the other ~69,000 (47% of the
        # TSDB) cost nothing, because job="apiserver" still had them.
        #
        # Talos runs those components as separate static pods with separate
        # registries, so a Talos kubelet exposes only kubelet metrics. The same
        # regex here would now drop nothing on a good day — and on a bad one it
        # is a live footgun, because it is written against __name__ alone: the
        # moment a genuine kubelet series is named apiserver_*/etcd_* it
        # disappears with no second copy anywhere.
        #
        # Expect the series count to look very different after cutover. The 15d
        # retention and the 8GiB retentionSize above were both sized against the
        # post-drop k3s TSDB; re-measure before trusting either.
        metricRelabelings:
          # Chart default for this endpoint, preserved — setting this key
          # replaces the list rather than appending to it, so dropping the k3s
          # entry above meant keeping this one explicitly.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
