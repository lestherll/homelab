# Re-verify current chart version at implementation time (plan §7 — this chart
# moves roughly weekly). Verified against ArtifactHub as of 2026-08-04: 86.1.0.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        # Deliberate reduction from the current podman stack's 30d, to fit
        # D7's ~20%/~3GB budget with headroom for Loki's later addition.
        retention: 15d
        # retention (time) alone does not bound disk use, and the 10Gi below is
        # decorative: the provisioner hands out a plain hostPath directory with
        # no quota, so `df` inside the pod reports the whole `fast` filesystem.
        # Left unbounded, a cardinality spike fills that volume and every other
        # durable claim on it rather than dropping the oldest blocks. Set below
        # the claim so Prometheus compacts against its own limit first.
        #
        # 8GiB against a 20 GiB volume shared with Postgres and the SeaweedFS
        # filer is the tightest this number has been — it was sized when the
        # backing disk was a 106G SSD. Revisit it, not the volume, if the tier
        # gets crowded.
        retentionSize: 8GiB
        # Re-sized 2026-08-12, after the kubelet cardinality drop halved active
        # series (155,621 -> 80,475). Memory tracks head series, so the old
        # 1400Mi was sized against a TSDB that no longer exists: observed
        # ceiling is now 607Mi (max over 2h, post-compaction — the 761Mi max
        # over 8h spans the pre-compaction head and isn't representative).
        # 1024Mi is ~1.7x that.
        #
        # CPU limit raised despite usage *falling* to 59m: average is
        # misleading here because the work is bursty (scrape, rule eval,
        # compaction), and at 500m the container was throttled in 17.4% of its
        # CFS periods. Throttling a bursty workload stretches wall-clock time
        # without showing up as high average usage — the same trap as
        # node-exporter below, just less severe.
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { cpu: 750m, memory: 1024Mi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              # `fast`, not `scratch`, and this is the one observability claim
              # where the tier is a real decision rather than a rename. Two
              # reasons: an 8GiB TSDB does not belong on a 20 GiB system disk it
              # would share with etcd and every containerd layer, and `fast`
              # being a fixed-size volume means a cardinality spike fills 20 GiB
              # and stops instead of taking the node down. That it also survives
              # a VM rebuild is a welcome side effect, not the reason.
              storageClassName: fast
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Ships power metrics to the long-term store (infrastructure/
        # victoria-metrics), because the `retention: 15d` above is global and
        # energy-cost tracking spans billing periods. Nothing else here changes:
        # Prometheus remains the primary store for everything, this is a copy of
        # a handful of series that need to outlive its window.
        #
        # The writeRelabelConfigs filter is NOT optional. remoteWrite's default
        # is to ship EVERY series — without the keep rule this would put a second
        # full copy of a ~64k-series TSDB onto a 5400rpm disk. Extend the regex
        # when a new metric genuinely needs multi-year retention (e.g. wall-power
        # metrics from a metering smart plug), not by relaxing it.
        #
        # Note node_rapl_* is CPU package + DRAM only, not whole-system power —
        # see LES-85 before building cost panels on it.
        remoteWrite:
          - url: http://vm-longterm.observability.svc.cluster.local:8428/api/v1/write
            name: vm-longterm
            writeRelabelConfigs:
              - sourceLabels: [__name__]
                regex: "node_rapl_.*"
                action: keep

    alertmanager:
      # Until this block existed, every alert on this cluster was discarded.
      # The chart's default route sends everything to a receiver literally named
      # "null", and 35 stock rule groups — node health, disk pressure, apiserver
      # SLOs, kubelet, CNPG — plus every Application's own rules fired into it.
      # Nothing was broken; nothing was delivered either.
      #
      # THE ROUTING LIVES HERE IN PLAIN TEXT ON PURPOSE. Only the ntfy URL is
      # secret (alertmanager-ntfy-secret.sops.yaml, because a public repo plus a
      # plaintext topic is a write credential to the operator's phone). What gets
      # sent, what is suppressed, and how often it repeats is exactly the part
      # worth reading in a diff, so none of it is hidden behind SOPS.
      # NOTE this REPLACES the chart's default config wholesale rather than
      # merging into it, so everything below that looks like boilerplate — the
      # global block, the inhibit rules, the templates path — is carried over
      # deliberately from the chart's default. Dropping them would silently
      # discard the stock suppression rules, which is precisely what stops one
      # incident from arriving as three notifications the day `warning` is
      # promoted to a delivered severity.
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [namespace, alertname]
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: [namespace, alertname]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: [namespace]
          - target_matchers: ['alertname = "InfoInhibitor"']
        templates:
          - /etc/alertmanager/config/*.tmpl
        route:
          # The default stays "null": silence is still the default outcome, and
          # a severity has to be routed deliberately to escape it. Inverting
          # this — deliver by default, silence exceptions — is how a phone ends
          # up buzzing for a single-node etcd rule that can never be fixed, and
          # how an operator learns to swipe alerts away unread.
          receiver: "null"
          group_by: [namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # The chart's own always-firing liveness alert. Its purpose is to
            # prove the pipeline works to an external dead-man's-switch service;
            # there is no such service here, so it stays discarded.
            - matchers: ['alertname = "Watchdog"']
              receiver: "null"
            # Critical only, deliberately, and this is the whole delivery
            # surface for now. Several stock groups are written for multi-node
            # clusters (etcd quorum, scheduler and controller-manager SLOs) and
            # will fire, be perfectly true, and be unfixable on a single node.
            # Routing warnings today would bury the alerts that matter under
            # them within a week. Warning gets promoted from evidence — after
            # watching what actually fires — not from prediction.
            - matchers: ['severity = "critical"']
              receiver: ntfy
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              # url_file, not url. Alertmanager's assembled config lands in a
              # Secret that anything with `get secrets` in this namespace can
              # read; url_file keeps the topic out of it and leaves the mounted
              # file as the single place it exists in the cluster.
              - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url
                # Recovery notices too. An alert that never says "resolved"
                # trains you to go and check by hand every time, which costs
                # more attention than the alert saved.
                send_resolved: true
                http_config:
                  http_headers:
                    # ntfy reads these; the POST body becomes the message text.
                    #
                    # KNOWN ROUGH EDGE, named rather than discovered later: the
                    # body is Alertmanager's own JSON and its webhook receiver
                    # has no body template, so the notification arrives as a
                    # JSON blob under a fixed title. It carries the alertname
                    # and summary, so it is legible, but it is not pretty.
                    # Prettifying it means a translator sitting between the two
                    # — a real component to run and pin — which is not worth
                    # delaying delivery for. Revisit if the volume ever makes
                    # the raw form genuinely unreadable.
                    Title:
                      values: ["homelab: critical alert"]
                    Priority:
                      values: ["high"]
                    Tags:
                      values: ["rotating_light"]
      alertmanagerSpec:
        # Mounts the Secret above at /etc/alertmanager/secrets/<name>/, which is
        # what makes url_file resolvable. Without this the config is valid and
        # Alertmanager fails at send time with a missing file — a failure that
        # only appears when an alert actually fires, i.e. at the worst moment.
        secrets:
          - alertmanager-ntfy
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 100m, memory: 128Mi }
        storage:
          volumeClaimTemplate:
            spec:
              # Silences and notification state. Small, and cheap to lose — the
              # alert rules themselves come from the chart, so a rebuild costs
              # at most a re-silence.
              storageClassName: scratch
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi

    grafana:
      admin:
        existingSecret: grafana-admin
      # The long-term store, as a second datasource. Panels spanning more than
      # the 15d Prometheus window — i.e. every meaningful energy-cost panel —
      # must select this one; short-range/live panels can use either.
      #
      # additionalDataSources is the chart's own hook for this: it renders into
      # the kube-prometheus-stack-grafana-datasource ConfigMap, which the
      # datasource sidecar then provisions into Grafana. That sidecar is enabled
      # by chart default (as is the dashboards one, which is set explicitly
      # below) — so nothing extra needs turning on, and unlike dashboards this
      # needs no labelled ConfigMap of its own under dashboards/.
      additionalDataSources:
        - name: VictoriaMetrics
          uid: vm-longterm
          # VictoriaMetrics implements the Prometheus query API, so the stock
          # Prometheus datasource type works — no plugin needed (which also
          # matters because plugin installs would need egress at pod start).
          type: prometheus
          access: proxy
          isDefault: false
          url: http://vm-longterm.observability.svc.cluster.local:8428
          jsonData:
            # Matches the scrape interval these series are written at, so
            # Grafana's auto-step doesn't request finer resolution than exists.
            timeInterval: 30s
      sidecar:
        dashboards:
          enabled: true
        # The two sidecars ship with no requests or limits at all, so they were
        # invisible to D7's ~3GB observability budget while actually holding
        # ~154Mi between them. They are ConfigMap watchers — steady-state RSS,
        # no growth path — so bounding them is about making the budget sum
        # honest, not about constraining them.
        #
        # Corrected 2026-08-12: the first attempt sized these off a single spot
        # reading (78Mi/76Mi) taken minutes after a restart, which undershot.
        # Real ceilings over 8h are 95Mi and 93Mi — 74% and 72% of the 128Mi
        # first set — and sc-dashboard was throttled in 54.5% of its CFS
        # periods against the 50m CPU limit. Sizing a just-restarted process is
        # how you get this wrong; use max_over_time, not `kubectl top`.
        resources:
          requests: { cpu: 10m, memory: 96Mi }
          limits: { cpu: 200m, memory: 192Mi }
      # Without this, /var/lib/grafana (dashboards, users, prefs) is an emptyDir
      # — wiped on every pod restart/reschedule. type: pvc matches this chart's
      # default single-replica Deployment mode (the chart's own commented
      # example uses type: sts, which is only for multi-replica StatefulSet mode).
      persistence:
        enabled: true
        type: pvc
        # Grafana's sqlite DB: users, prefs, and any dashboard edited in the UI
        # rather than committed. Dashboards proper are provisioned from labelled
        # ConfigMaps under dashboards/, so they are unaffected by losing this.
        storageClassName: scratch
        accessModes: ["ReadWriteOnce"]
        size: 1Gi
      # 256Mi was enough for classic Grafana but Grafana 13's unified-storage
      # layer (dashboard-service watch loop + bleve-backend in-memory search
      # indexes) pushes steady-state RSS past that, causing periodic OOMKills
      # (observed: container OOMKilled at 312Mi actual usage, GOMEMLIMIT
      # derived from the old 256Mi limit made it worse, not better).
      # Bumped again 2026-08-10: the 512Mi/200m limits from the first fix were
      # themselves exhausted once the CloudNativePG + SeaweedFS dashboards
      # (D15) landed — observed steady-state at 200m/200m CPU (fully
      # throttled) and 501Mi/512Mi memory, with live liveness/readiness probe
      # failures and a prior OOMKill-shaped restart. New limits sized for
      # ~1.5x that steady-state, and still comfortably inside D7's ~3GB
      # observability budget (CONCEPT.md) alongside Prometheus/Alertmanager.
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { cpu: 300m, memory: 768Mi }

    # Control-plane component monitors: all off, because they cannot work here.
    # Talos serves etcd/scheduler/controller-manager metrics behind its own PKI,
    # which in-cluster credentials do not satisfy. Nothing is lost: no rule or
    # dashboard in this repo joins on those jobs, and the chart drops their
    # default alerts along with the monitors (so nothing is left firing at a
    # target that will never exist).
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 50m, memory: 64Mi }

      # Flux's own objects, as metrics.
      #
      # WHY THIS IS NEEDED AT ALL: Flux used to export gotk_suspend_status and
      # gotk_reconcile_condition from its controllers. As of the v2.8.8 running
      # here it does not — the controllers serve only reconcile *durations* and
      # token-cache counters (verified by curling a controller's :8080/metrics,
      # not inferred from release notes). Flux's object status now comes from
      # kube-state-metrics reading the CRs directly, which is what this is.
      #
      # WHAT IT BUYS, and it is not a duplicate of the notification path in
      # infrastructure/flux-notifications/: that path is EVENT-driven, so it
      # reports things that *happen*. This reports what *is*. The two gaps it
      # closes are exactly the ones events cannot see —
      #   * a SUSPENDED object, where nothing is failing because nothing is
      #     happening at all, and
      #   * an object that has been stuck not-ready for a long time without
      #     emitting fresh error events.
      #
      # Cardinality cost is 16 series on this cluster (one per Flux object),
      # which is noise-level against the ~64k total and worth stating given how
      # much effort went into cutting cardinality here.
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              # One metric name across all three kinds, distinguished by the
              # customresource_kind label kube-state-metrics adds itself. A
              # single series name means one alert expression covers every Flux
              # kind, including any added later.
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      # exported_namespace, not namespace: kube-state-metrics
                      # reserves `namespace` for its own scrape-target labels
                      # and the two would collide.
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      # CAREFUL when writing PromQL against this: the label is
                      # ABSENT when spec.suspend is unset, not "false"
                      # (confirmed live). So `suspended="true"` is the only safe
                      # way to match — `suspended!="true"` also matches every
                      # series that simply lacks the label.
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]

      rbac:
        # kube-state-metrics' own role covers built-in kinds only, so without
        # these it starts cleanly and silently exports nothing for Flux.
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
            resources: ["*"]
            verbs: ["get", "list", "watch"]
          # Not obvious, and found by running this config against a throwaway
          # kube-state-metrics before touching the live one: custom-resource
          # state resolves each groupVersionKind through the CRD API, so it
          # needs to list CustomResourceDefinitions too. Without this it runs,
          # reports healthy, and emits zero gotk series while logging an RBAC
          # error nobody is watching for.
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch"]

    prometheus-node-exporter:
      # Both are the chart's defaults, set explicitly for documentation.
      #
      # hostNetwork was RECONSIDERED at the Talos cutover and deliberately KEPT.
      # Its old justification is indeed gone: it used to bind 0.0.0.0:9100 on
      # the bare-metal host, a regression that host_prereqs's ufw rule fenced
      # off. There is no ufw inside the guest. But the exposure it was fencing
      # is gone too — the VM sits on a NAT'd libvirt network with no inbound
      # route from anywhere but the host, so :9100 is not reachable off-box at
      # all.
      #
      # Turning it off was the alternative and was rejected as an unforced risk:
      # /proc/net is per-network-namespace (it resolves through /proc/self/net
      # regardless of the host /proc bind mount), so a non-hostNetwork
      # node-exporter reports the POD's interfaces rather than the node's, and
      # the netdev/netclass collectors — precisely the ones the 500m limit below
      # was sized for — would silently start describing the wrong netns. Losing
      # network metrics to buy back a port that is already unreachable is a bad
      # trade.
      #
      # NOTE: what this DaemonSet now calls "the host" is the VM, not the
      # metal. Everything below /host is the guest's view.
      hostNetwork: true
      hostPID: true
      # CPU limit raised 50m -> 500m, 2026-08-12. The 50m above was the chart's
      # default, adopted here "for documentation" without ever being measured
      # against this host — and that host had ~20 network interfaces (veths,
      # cni0, flannel.1, tailscale0) for the netclass collector to walk.
      #
      # That interface count is a guest-side question after cutover: tailscale0
      # stays on the metal (Tailscale is host-only by decision) and the bridge
      # is different, so the walk is probably cheaper. 500m is kept as the safe
      # direction to be wrong in — over-provisioning a 6%-of-box limit costs
      # nothing, and the failure mode below is what under-provisioning looks
      # like. Re-measure before trimming it.
      #
      # At 50m the container got a 5% duty cycle and was throttled in 85.5% of
      # its CFS periods. A ~194ms scrape (3.87s wall x 0.05 duty) stretched to
      # ~4s, occasionally past the 10s global scrape_timeout — which is what
      # the 10.009s max scrape duration and the 98.75% 24h availability
      # actually were: failed scrapes, not a slow exporter. The liveness probe
      # (timeoutSeconds: 1, against the *static* / page) landed inside those
      # throttled windows and couldn't get enough CPU to answer, producing the
      # recurring Unhealthy events and eventual SIGTERM restarts.
      #
      # Diagnosis note for next time: every collector reporting a near-
      # identical ~4s was the tell. One slow collector looks like one outlier;
      # uniform slowness across all of them is a shared constraint, i.e. the
      # cgroup. Average CPU (6.7m) looks harmless and hides this completely.
      #
      # 500m lets the same 194ms of work finish in ~390ms, inside both the 1s
      # probe timeout and the 10s scrape timeout, and is 6% of this 8-core box.
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 500m, memory: 32Mi }
      # This DaemonSet measures the VM, not the metal. /sys/class/powercap is
      # empty inside the guest, so the rapl collector reports nothing and the
      # power dashboards under dashboards/ have no data source — reconnecting
      # them means running an exporter on the host, which is LES-97, not a
      # config change here.

    prometheusOperator:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 200m, memory: 256Mi }

    kubelet:
      serviceMonitor:
        # 10s is the chart's default, chosen to match the kubelet's own cAdvisor
        # housekeeping interval so no update is missed. Dropped to 30s to match
        # every other target here: at 10s this endpoint was 13% of total ingest
        # (359 of 2,783 samples/sec) off only 3,593 samples per scrape — cost
        # driven purely by frequency, not by how much it returns.
        #
        # The tradeoff is real but narrow. Counters (container CPU, network
        # bytes) lose nothing: rate() over a window is exact regardless of how
        # often a monotonic counter is sampled. What degrades is gauges —
        # container_memory_working_set_bytes is now observed 1-in-3 as often,
        # so brief memory spikes can pass unseen. That matters here more than
        # it looks: this repo has twice used container memory metrics to
        # diagnose Grafana OOMKills. If a future OOM investigation comes up
        # short on resolution, this is the line to revisit.
        cAdvisorInterval: 30s
        # DO NOT add a broad `(apiserver|etcd)_.*` drop here. It is tempting
        # because the kubelet endpoint is the largest single source of series,
        # but this cluster runs the control-plane components as separate static
        # pods with separate registries — so the kubelet exposes only kubelet
        # metrics, and such a rule would drop nothing on a good day. On a bad
        # one it is a footgun: matching on __name__ alone means the moment a
        # genuine kubelet series is named that way it vanishes with no second
        # copy anywhere.
        #
        # `retention` and `retentionSize` above were sized against a different
        # cluster's series count. Re-measure before trusting either.
        metricRelabelings:
          # Chart default for this endpoint, preserved — setting this key
          # replaces the list rather than appending to it, so it has to be
          # restated rather than inherited.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
