# Same pattern as grafana-ingress.yaml. Needed by heartbeat_watchdog (plan §8),
# which hits this hostname's /-/healthy endpoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: observability
spec:
  ingressClassName: tailscale
  tls:
    - hosts: ["alertmanager"]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-alertmanager
                port:
                  number: 9093
