# A standalone Ingress rather than kube-prometheus-stack's built-in grafana.ingress
# values, to keep the tailnet concern separate from the observability release.
# Hostname comes from spec.tls[].hosts, not metadata.name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
spec:
  ingressClassName: tailscale
  tls:
    - hosts: ["grafana"]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
