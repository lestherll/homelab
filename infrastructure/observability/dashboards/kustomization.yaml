# node-exporter-full.json is the standard "Node Exporter Full" community
# dashboard (grafana.com ID 1860, uid rYdddlPWk), unmodified — the same one
# commonly hand-imported alongside node_exporter, now provisioned from git
# instead so it survives Grafana pod restarts without a manual re-import.
# configMapGenerator content-hashes the name on every edit, so a dashboard
# update always produces a clean new ConfigMap rather than an in-place edit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    files:
      - node-exporter-full.json
    options:
      labels:
        grafana_dashboard: "1"
  # cloudnativepg.json is the official CloudNativePG dashboard (grafana.com ID
  # 20417, uid cloudnative-pg), published by the CloudNativePG org. Grafana's
  # import-wizard metadata (__inputs/__requires/__elements) is stripped: the
  # dashboard already carries a real DS_PROMETHEUS datasource templating
  # variable that resolves on its own, and leaving those blocks in makes the
  # sidecar treat the file as an un-imported export. Otherwise unmodified.
  - name: grafana-dashboard-cloudnativepg
    files:
      - cloudnativepg.json
    options:
      labels:
        grafana_dashboard: "1"
  # seaweedfs.json is grafana.com ID 19173 ("SeaweedFS", chrislusf — the same
  # maintainer as the default server image). Rougher than the other two
  # dashboards here, and flagged as such rather than presented as equally
  # solid: schemaVersion 14 (2019, pre-flat-panel/rows-based layout), no
  # templating.list datasource variable (every panel instead carries the
  # literal import-wizard placeholder "${DS_PROMETHEUS-DEV}", replaced here
  # with null so panels fall back to this Grafana's one configured
  # datasource — without that edit every panel shows "datasource not
  # found"). Metric names (SeaweedFS_filer_request_total, etc.) match this
  # repo's pinned server version's exposed metric families, but the
  # dashboard predates six years of seaweedfs releases and has not been
  # visually verified end-to-end — do that once real traffic is flowing
  # (Verification, below), not assumed from the metric names matching.
  - name: grafana-dashboard-seaweedfs
    files:
      - seaweedfs.json
    options:
      labels:
        grafana_dashboard: "1"
