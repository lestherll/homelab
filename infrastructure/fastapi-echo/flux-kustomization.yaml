# Points at a *different* git repo (fastapi-echo's own), not this one — the
# app's manifests live entirely there (deploy/); this file is just the
# pointer, kept minimal on purpose (see gitrepository-fastapi-echo.yaml for
# the source registration).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fastapi-echo
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: fastapi-echo
