# Points at a *different* git repo (fastapi-echo's own), not this one — the
# app's manifests live entirely there (deploy/); this file is just the
# pointer, kept minimal on purpose (see gitrepository-fastapi-echo.yaml for
# the source registration).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fastapi-echo
  namespace: flux-system
  annotations:
    # Being handed off to the app repo's own CI (LES-55). Load-bearing on this
    # object in particular: this Kustomization has `prune: true`, so letting
    # Flux garbage-collect it would cascade into deleting every workload it
    # applied. See gitrepository-fastapi-echo.yaml for the full rationale and
    # the two-commit sequence.
    #
    # TEMPORARY — strip once the app repo's CI owns the object:
    #   kubectl annotate kustomization/fastapi-echo -n flux-system \
    #     kustomize.toolkit.fluxcd.io/prune-
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: fastapi-echo
