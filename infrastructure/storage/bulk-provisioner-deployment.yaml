# A second local-path-provisioner instance, distinguished from k3s's packaged
# one purely by --provisioner-name. That flag is what makes this approach work
# without touching the addon at all: each provisioner claims only the
# StorageClasses whose `provisioner:` field matches its own name, so this one
# serves `local-path-bulk` and ignores `local-path`/`local-path-retain`.
#
# The alternative — `--disable local-storage` in the k3s config plus taking
# ownership of the default classes — was rejected: it needs a k3s restart, it
# deletes the addon's objects (including the default StorageClass) in a window
# before Flux re-creates them, and it makes every future k3s upgrade our problem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-bulk
  namespace: storage-bulk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-bulk
  template:
    metadata:
      labels:
        app: local-path-bulk
    spec:
      serviceAccountName: local-path-bulk
      containers:
        - name: local-path-provisioner
          # Matches the version k3s v1.36.2+k3s1 ships, verified 2026-08-11
          # against the running kube-system deployment. Keep the two in step so
          # both classes get the same provisioning semantics.
          image: rancher/local-path-provisioner:v0.0.36
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - homelab.local/local-path-bulk
            - --configmap-name
            - local-path-bulk-config
            - --service-account-name
            - local-path-bulk
            - --helper-pod-file
            - /etc/config/helperPod.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          # Sized against the existing kube-system provisioner's steady state
          # (idle at ~10Mi; it only does work when a PVC is created or deleted).
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config-volume
          configMap:
            name: local-path-bulk-config
