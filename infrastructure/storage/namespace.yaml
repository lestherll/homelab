# One namespace for all three provisioner instances.
#
# The PodSecurity label is load-bearing. Talos enforces the `baseline` profile
# by default, and baseline forbids hostPath volumes outright. Every one of these
# provisioners works by launching a short-lived helper pod that bind-mounts the
# node path to mkdir/rm the volume directory — so under baseline, provisioning
# fails at the point a PVC is first created, not at deploy time. The symptom is
# a PVC stuck Pending with a helper-pod admission error in the provisioner log.
apiVersion: v1
kind: Namespace
metadata:
  name: storage
  labels:
    pod-security.kubernetes.io/enforce: privileged
