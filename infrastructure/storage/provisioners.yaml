# The three local-path-provisioner instances that back this cluster's three
# StorageClasses. Talos ships no storage provisioner, so the repo owns every
# instance — which is what makes it possible to put each class on a different
# disk: an instance claims only the StorageClasses whose `provisioner:` field
# matches its own --provisioner-name, so three instances with three names
# partition the claims cleanly. One instance with one nodePathMap could only
# ever serve one disk.
#
# What differs between the three is exactly two things: --provisioner-name and
# the nodePathMap path. Everything else — image, RBAC identity, helper pod,
# setup/teardown scripts, resource envelope — is deliberately identical, so that
# the classes differ in the guarantee they offer and in nothing else.
#
# The `node:` key is the real node name rather than
# DEFAULT_PATH_FOR_NON_LISTED_NODES. Under Talos the mount path is identical on
# every node by construction (it comes from UserVolumeConfig in the machine
# config, not from an imperative Ansible assert), so the default-path escape
# hatch is no longer protecting against anything — but it *would* silently give
# a node whose machine config omits the volume a directory on its system disk.
# Naming the node turns that into a Pending PVC instead. Harmless while every
# cluster here is single-node; load-bearing the day one grows.

apiVersion: v1
kind: ConfigMap
metadata:
  name: scratch-config
  namespace: storage
data:
  # /var is Talos's EPHEMERAL partition — the writable filesystem on the system
  # disk, which is the disk `terraform destroy -target=...system` throws away.
  # That disposability is the guarantee `scratch` offers, not an accident of
  # where the path landed.
  config.json: |-
    {
      "nodePathMap": [
        { "node": "DEFAULT", "paths": ["/var/lib/local-path-provisioner"] }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  # Pinned rather than left at upstream's unpinned `busybox` default. This
  # image does nothing but mkdir and rm, so there is no reason to chase it.
  # Re-verified present 2026-08-16.
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: "rancher/mirrored-library-busybox:1.37.0"
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch-provisioner
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scratch-provisioner
  template:
    metadata:
      labels:
        app: scratch-provisioner
    spec:
      serviceAccountName: local-path-provisioner
      containers:
        - name: local-path-provisioner
          # v0.0.37 verified as the latest release 2026-08-16.
          image: rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - homelab.local/scratch
            - --configmap-name
            - scratch-config
            - --service-account-name
            - local-path-provisioner
            - --helper-pod-file
            - /etc/config/helperPod.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          # Idles at ~10Mi — it only does work when a PVC is created or
          # deleted, so this is steady state, not a ceiling to grow into.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config-volume
          configMap:
            name: scratch-config