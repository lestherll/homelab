# The ONE local-path-provisioner instance left, backing `scratch` alone.
#
# There used to be three, one per class, so that each class could sit on a
# different disk — an instance claims only the StorageClasses whose
# `provisioner:` field matches its own --provisioner-name, so three names
# partitioned the claims cleanly.
#
# `fast` and `bulk` moved to Longhorn with the fleet migration (infrastructure/longhorn/), which
# does that partitioning by DISK TAG instead and does it better: a tag can move
# to another machine's disk without any consumer knowing. `scratch` deliberately
# stayed behind — platform-api-migration-impact.md §3's "do not replicate twice", and
# there is nothing in a disposable volume worth replicating.
#
# The `node:` key is DEFAULT_PATH_FOR_NON_LISTED_NODES, and that reversed a
# deliberate earlier choice. It used to name the real node, to stop a machine
# whose config omitted a UserVolumeConfig from silently getting a directory on
# its system disk — a Pending PVC being the better failure. That argument was
# about `fast` and `bulk`, which no longer live here. `scratch`'s path is on the
# EPHEMERAL partition, which every Talos node has by construction and no machine
# config can omit, so there is nothing left to guard against and naming a node
# would only mean editing this file every time the fleet grows.
#
# Note the sentinel is the literal string DEFAULT_PATH_FOR_NON_LISTED_NODES.
# "DEFAULT" is not it, and the provisioner rejects the claim with "config
# doesn't contain node <name>, and no DEFAULT_PATH_FOR_NON_LISTED_NODES
# available" — measured 2026-09-02.

apiVersion: v1
kind: ConfigMap
metadata:
  name: scratch-config
  namespace: storage
data:
  # /var is Talos's EPHEMERAL partition — the writable filesystem on the system
  # disk, which is the disk `terraform destroy -target=...system` throws away.
  # That disposability is the guarantee `scratch` offers, not an accident of
  # where the path landed.
  config.json: |-
    {
      "nodePathMap": [
        { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/var/lib/local-path-provisioner"] }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  # Pinned rather than left at upstream's unpinned `busybox` default. This
  # image does nothing but mkdir and rm, so there is no reason to chase it.
  # Re-verified present 2026-08-16.
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: "rancher/mirrored-library-busybox:1.37.0"
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratch-provisioner
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scratch-provisioner
  template:
    metadata:
      labels:
        app: scratch-provisioner
    spec:
      serviceAccountName: local-path-provisioner
      containers:
        - name: local-path-provisioner
          # v0.0.37 verified as the latest release 2026-08-16.
          image: rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - homelab.local/scratch
            - --configmap-name
            - scratch-config
            - --service-account-name
            - local-path-provisioner
            - --helper-pod-file
            - /etc/config/helperPod.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          # Idles at ~10Mi — it only does work when a PVC is created or
          # deleted, so this is steady state, not a ceiling to grow into.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config-volume
          configMap:
            name: scratch-config