# One identity shared by all three provisioner instances. They differ only in
# which node path they write to and which StorageClass they answer for; the
# privilege each needs is identical, and local-path-provisioner has no
# per-instance authorization model to exploit even if they were split.
#
# Deliberately upstream's own privilege set for local-path-provisioner, rather
# than a hand-tightened variant. The provisioner drives a helper pod to
# mkdir/rm on the node, and the exact verb set it needs
# across pods/pods-log/endpoints is an upstream implementation detail that has
# changed between releases — a tighter guess here fails at provision time, in a
# path that only runs when a new PVC is created.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner
  namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints", "persistentvolumes", "pods"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner
    namespace: storage
