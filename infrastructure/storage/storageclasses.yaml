# The three classes this platform offers. They are named for the guarantee, not
# for the implementation — `local-path` was a provisioner, not a promise, and a
# consumer choosing storage should be picking a service class the way it would
# on a managed cloud, without knowing what backs it.
#
# StorageClasses cannot be renamed in place: `provisioner` and `reclaimPolicy`
# are immutable, so the only migration path is create-new-and-move-every-volume.
# Cutover recreates all three on a fresh cluster and restores from dumps, so the
# rename is free on that day and a full storage migration on any day after it.
#
# NOTE THERE IS NO DEFAULT CLASS, and that is deliberate. On k3s, `local-path`
# was default because the addon made it so — the choice was never taken. A PVC
# that names no class now stays Pending, loudly and immediately, instead of
# silently landing somewhere wrong. Defaulting to `scratch` would preserve the
# old footgun (a chart that omits storageClassName silently gets Delete
# storage); defaulting to `fast` would put every disposable PVC on the disk
# under the most contention. Every PVC-producing site in this repo already names
# a class explicitly, so this costs nothing today.
#
# All three are WaitForFirstConsumer: a local-path PV is a directory on one
# specific node, so binding before the pod is scheduled would pin the pod to a
# node chosen for no reason.

# --- scratch -----------------------------------------------------------------
# Disposable, on the system disk, deleted with its claim.
#
# The system disk is the one the VM's own lifecycle owns — a
# `terraform destroy -target=module.cluster.libvirt_volume.system` throws it
# away, and that targeted destroy is the routine rebuild primitive here, not an
# emergency. So `scratch` means "this will not survive a VM rebuild", which is a
# stronger statement than Delete-on-release alone.
#
# It also shares 20 GiB with etcd and every containerd image layer, so nothing
# with an unbounded growth path belongs here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: scratch
provisioner: homelab.local/scratch
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
# --- fast --------------------------------------------------------------------
# Durable, low-latency, small. The default choice for anything D4 classifies as
# Durable that is not bulk sequential data: Postgres PGDATA, the SeaweedFS filer
# index, the Prometheus TSDB.
#
# Backed by its own 20 GiB virtual disk on the SSD, attached by serial and
# outliving the VM (verified end to end in the phase 2.5 rehearsal — see the
# execution log in docs/talos-terraform-migration-notes.md). Retain, so a
# deleted PVC orphans its data for manual cleanup rather than destroying it.
#
# The fixed size is a feature: AGENT.md's "local-path PVCs have no quota" still
# holds *within* the volume, but a runaway now fills 20 GiB and stops, instead
# of taking the node's root filesystem with it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
provisioner: homelab.local/fast
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# --- bulk --------------------------------------------------------------------
# Durable, high-capacity, sequential. Backed by an image file on the 931G
# 5400rpm spinning disk.
#
# Use this for data that is large, grows over time, and is read and written
# mostly sequentially — object storage volumes being the motivating case. Do NOT
# use it for anything latency-bound: Postgres WAL fsyncs and Prometheus TSDB
# compactions both behave badly on a 5400rpm drive, and both are small enough
# that `fast` is the right home. See docs/storage-tiering-notes.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bulk
provisioner: homelab.local/bulk
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
