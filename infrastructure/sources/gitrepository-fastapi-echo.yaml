apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fastapi-echo
  namespace: flux-system
  annotations:
    # Being handed off to the app repo's own CI (LES-55). This annotation is
    # what makes the hand-off survivable: without it, deleting this file would
    # make Flux garbage-collect the object, and deleting the Kustomization that
    # depends on it takes the running app down with it. With it, removing the
    # file only drops the object from Flux's inventory — the live object stays
    # put until the app's registration workflow adopts it.
    #
    # Deliberately a separate commit from the deletion. Annotating and deleting
    # together does nothing: Flux never applies an annotation it can no longer
    # see, and prunes on the same reconcile.
    #
    # TEMPORARY. Once the app repo's CI owns this object, the annotation is
    # residue that misdescribes it — strip it with
    #   kubectl annotate gitrepository/fastapi-echo -n flux-system \
    #     kustomize.toolkit.fluxcd.io/prune-
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  url: https://github.com/lestherll/fastapi-echo
  ref:
    branch: main
