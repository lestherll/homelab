# What the operator is allowed to do once a Google-issued OIDC token has been
# accepted by the apiserver (terraform/modules/talos-cluster/talos.tf's
# AuthenticationConfiguration). LES-104.
#
# Cluster-scoped and plain built-in kinds — no CRD for a cold apply's dry-run
# to trip over — so this is safe in the main infrastructure/ Kustomization,
# same reasoning as app-registrar/.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-operator
rules:
  # core + workloads
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  # Flux
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["*"]
  # kro + this repo's own platform API
  - apiGroups: ["kro.run", "platform.homelab"]
    resources: ["*"]
    verbs: ["*"]
  # Cilium, Tailscale, CloudNativePG, SeaweedFS
  - apiGroups:
      - cilium.io
      - tailscale.com
      - postgresql.cnpg.io
      - seaweed.seaweedfs.com
    resources: ["*"]
    verbs: ["*"]
  # Cluster-scoped, read-only, deliberately: the operator inspects these but
  # nothing here writes them through this Role.
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # metrics-server's aggregated API, read-only — without this `kubectl top`
  # is Forbidden even though metrics-server itself is deployed and healthy.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # CRDs are READ-ONLY, and the asymmetry is the point. `get`/`list`/`watch`
  # is inspection, which tooling genuinely needs: `flux check` fails its whole
  # "checking crds" stage without it, and reports a bare Forbidden naming the
  # identity rather than the missing verb, so it reads as "OIDC is broken"
  # when it is one absent rule. Writing a CRD would be "redefining what a CRD
  # even is" and stays denied. Reading one grants nothing — CRD schemas carry
  # no secrets and no permissions.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # NOTHING granted on rbac.authorization.k8s.io/* — no self-escalation, even
  # for the one identity this binds to. That is the rule this file exists to
  # hold, and the CRD read above is not an exception to it.
---
# A ClusterRoleBinding, not a Role — this is the operator's own cluster, and
# single-user means there is no second identity to scope narrower against.
#
# subjects[].name is a literal, unlike the Terraform-side email allow-list
# above it in the auth chain (google_operator_email). RBAC subjects can't be
# templated without Flux postBuild.substitute, which nothing else in this repo
# uses, so introducing it to hide one non-secret string here would be more
# machinery than it buys. Must match claimMappings.username's claim+prefix
# from the AuthenticationConfiguration exactly: `google:` + the email claim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-operator-google
subjects:
  - kind: User
    name: "google:ljllacuna5@gmail.com"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: homelab-operator
  apiGroup: rbac.authorization.k8s.io
