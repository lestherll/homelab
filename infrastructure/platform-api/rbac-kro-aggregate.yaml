# The privilege document for kro.
#
# kro runs with `rbac.mode: aggregation` (see infrastructure/kro/helmrelease.yaml),
# so its base role covers only its own machinery — ResourceGraphDefinitions,
# GraphRevisions, CRDs, ConfigMaps, Leases, Events. It has no access to
# anything an RGD renders unless granted here, via the aggregation label.
#
# This file is therefore load-bearing, not bookkeeping: adding a new kind to an
# RGD without adding it here fails at reconcile time with a permission error.
# That is the intended trade — every principal's privileges should be
# enumerable from a document rather than discovered by experiment, and this
# is that document.
#
# Rule of thumb when extending: grant the API groups the RGDs *render*, plus
# the platform.homelab group itself (kro reconciles its own generated instance
# CRDs and writes their status).
#
# REMOVING a grant is the dangerous direction and needs two changes, not one.
# kro lists ORPHANS of every kind it previously rendered on each reconcile, so a
# revoked grant makes that list forbidden — and that fails the whole reconcile,
# not just the cleanup. Every instance of the affected RGD parks at IN_PROGRESS
# with the permission error in .status.conditions, and hand-deleting the leftover
# objects does not help, because the forbidden call is the list itself. Drop the
# resource from the RGD, let the instances reconcile clean, then remove the grant
# in a later change. Learned by reverting an RGD revision, which reverts its
# grant along with it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro-platform-api
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  # The generated instance CRDs. kro needs watch here for its informers, and
  # status write access to publish the resolution status the RGDs compute.
  - apiGroups: ["platform.homelab"]
    resources: ["*"]
    verbs: ["*"]

  # Rendered by the Application RGD.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # networkpolicies joins ingresses as of Application revision 5: every
  # Application renders one, restricting ingress to its own Tailscale proxy.
  # Note `delete` here is a real privilege — it is the verb that can take a
  # rendered lockdown back off. That is unavoidable (kro must be able to remove
  # what it created when an Application is deleted) and is the reason the policy
  # is generated from this document rather than hand-written per app: a missing
  # policy is visible as a diff here, not as an absence nobody notices.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Rendered by the Application RGD's spec.persistence (revision 3), which
  # replaced a hostPath bind-mount with a real claim. Only PVCs are granted,
  # never persistentvolumes: the claim is the app-facing object, and the PV is
  # the provisioner's to create. Both offered tiers are Retain, so `delete`
  # here releases a claim without destroying the volume behind it.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Rendered by the Database RGD. The PodMonitor is what closes the
  # currently-live gap where no CNPG cluster is scraped at all.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # podmonitors: rendered by BOTH the Database RGD (the CNPG exporter) and, as
  # of Application revision 4, by any Application that sets spec.metrics.
  # prometheusrules: rendered by every Application unconditionally — the
  # delivery-level alerts that need no cooperation from the app itself.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Rendered by the ObjectStorage RGD (Bucket) and the Application RGD's
  # per-attachment IAM set (S3Identity/S3Credentials/S3Policy/
  # S3PolicyBinding). kro also needs watch on the Seaweed kind itself: the
  # Database-side externalRef pattern doesn't apply here, but Bucket/S3*
  # objects reference the Seaweed cluster by name and kro resolves that
  # relationship through the same informer machinery.
  - apiGroups: ["seaweed.seaweedfs.com"]
    resources: ["buckets", "s3identities", "s3credentials", "s3policies", "s3policybindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["seaweed.seaweedfs.com"]
    resources: ["seaweeds"]
    verbs: ["get", "list", "watch"]

  # Read-only. The Application RGD does not create Secrets — CloudNativePG
  # mints <cluster>-app itself — but kro resolves references against them.
  # Deliberately not writable: nothing in this platform's design has kro
  # authoring credentials, and keeping it read-only makes that checkable.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
