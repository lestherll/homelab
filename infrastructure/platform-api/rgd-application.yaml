# Application — the consumer side of the platform API.
#
# Database/ObjectStorage are *resource* APIs: they provision infrastructure
# and know nothing about consumers. Application's `databases`/`objectStorage`
# lists are an *attachment* API: "consume that resource, with credentials
# wired in for me." Keeping the two separate is what lets future types
# (CodingEnvironment, batch workloads) adopt the same attachment shape later
# without touching either resource API.
#
# Attachments are lists with aliases from day one, even on an app with
# exactly one of something. A single-attachment app writes a one-item list.
# The group/version below is a one-way door, so the shape that avoids a
# cliff-edge migration on the day an app grows a second attachment has to be
# chosen now, not later.
#
# REVISION HISTORY (kro re-reconciles every existing instance against a new
# revision — this is itself evidence for "additive evolution is cheap"):
#   rev 1 — databases only (fastapi-echo's migration).
#   rev 2 — adds objectStorage, securityContext, persistence, all optional
#           and additive. fastapi-echo's existing instance is expected to
#           reconcile unchanged under this revision — confirmed as part of
#           this PR's own verification, not assumed.
#   rev 3 — persistence changes from a host bind-mount to a PVC:
#           `hostPath` (required) is REPLACED by `size`/`tier`. This is the
#           first BREAKING change to this API, and the only one so far that
#           could not be made additively — the field being removed was
#           required, and its value was a path that does not exist on the new
#           node. Landing with the Talos cutover for that reason.
#
#           Named casualty, accepted when the migration was planned:
#           personal-finance-dashboard's Application sets persistence.hostPath
#           and its manifests live in its own repo, so that instance stops
#           reconciling until that repo drops the field. Its host-side CLI
#           workflow — which read the same directory from the host shell —
#           goes with it; that CLI moves into a container or becomes an
#           endpoint on the app. fastapi-echo sets no persistence and is
#           unaffected.
#   rev 4 — telemetry, plus the fix for a rev-3 defect it uncovered.
#
#           Telemetry: an opt-in `metrics` block rendering a PodMonitor, and an
#           always-rendered PrometheusRule carrying three delivery-level alerts
#           that need no cooperation from the app. Purely additive — an existing
#           instance gains the alerts and changes shape in no other way.
#
#           The fix is NOT additive and is worth reading before upgrading:
#           rev 3's `includeWhen: ${has(schema.spec.persistence)}` never
#           excluded anything (see DEFAULTING TRAP below), so EVERY Application
#           has been silently holding a 1Gi `fast` PVC and an /app/data mount it
#           never asked for. Gating now reads `has(schema.spec.persistence.size)`
#           and `size` loses its default.
#
#           Consequence on upgrade, deliberate: any instance that did not ask
#           for persistence has its phantom PVC DELETED by kro on the next
#           reconcile. Both tiers are Retain, so the PV behind it survives as
#           Released and no data can be lost — but a Released PV per affected
#           app is left to clean up by hand. Verified live on fastapi-echo:
#           PVC removed, volume and volumeMount gone from the Deployment, app
#           unaffected. An instance that DOES set persistence.size is untouched.
#   rev 5 — a NetworkPolicy per Application, making the Tailscale identity
#           headers trustworthy. Purely additive to the schema (no new fields at
#           all) but NOT a no-op on the cluster: every existing Application gains
#           a real ingress restriction on the next reconcile. See the
#           networkPolicy resource at the end of this file for the full
#           reasoning, and docs/identity-headers.md for the app-side contract
#           this is the precondition for.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: application
spec:
  schema:
    apiVersion: v1alpha1
    kind: Application
    group: platform.homelab
    types:
      DatabaseAttachment:
        ref: string | required=true description="metadata.name of a Database in this namespace"
        # Constrained so every accepted alias yields a legal environment
        # variable name after upper-casing. Fails at kubectl apply / git push
        # time rather than deep in a reconcile loop.
        as: string | required=true pattern="^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" description="alias; becomes DATABASE_URL_<ALIAS>"
        # Escape hatch for a database this platform does not own. When set, no
        # Database is provisioned or looked up — the same env var is wired from
        # a pre-existing Secret instead.
        externalSecretName: string | description="wire from this existing Secret instead of a managed Database"
        externalSecretKey: string | default="uri" description="key within externalSecretName"
      ObjectStorageAttachment:
        ref: string | required=true description="metadata.name of an ObjectStorage in this namespace"
        # Same alias contract as DatabaseAttachment — becomes
        # S3_ENDPOINT_<ALIAS>/S3_BUCKET_<ALIAS>/AWS_ACCESS_KEY_ID_<ALIAS>/
        # AWS_SECRET_ACCESS_KEY_<ALIAS>, and the <appname>-<alias> prefix this
        # consumer is scoped to within the bucket.
        as: string | required=true pattern="^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" description="alias; becomes S3_*_<ALIAS>, and the app's key prefix within the bucket"
      SecurityContext:
        runAsUser: integer | description="pod-level runAsUser; omit to leave unset"
        runAsGroup: integer | description="pod-level runAsGroup; omit to leave unset"
        fsGroup: integer | description="pod-level fsGroup; omit to leave unset"
      # Revision 3 replaces this type's `hostPath` with a claim on a storage
      # tier. It was the worst hardware leak in the repo: a named user's home
      # directory, required, in a platform API — an app author had to know the
      # layout of one specific machine to ask for a gigabyte of disk. It also
      # could not survive the move to Talos, which has no home directories and
      # no shell to create one, so `type: Directory` was unsatisfiable there by
      # construction.
      #
      # The replacement mirrors the `size: small|medium` idiom this API already
      # uses, so it adds no new concept while deleting the only field that
      # required knowing anything about the host. An app's deploy/ directory is
      # now portable to a second cluster unchanged, which is the point.
      #
      # `scratch` is deliberately NOT offered as a tier. This field exists to
      # make state survive, and a class whose contract is "disposable" would be
      # an attractive nuisance here; an app that wants scratch space should use
      # emptyDir, which needs no platform feature at all.
      # Revision 4. Opt-in via an explicit `enabled` flag rather than by the
      # presence of the block — see the DEFAULTING TRAP note on Persistence
      # below for why presence is not something this API can test.
      #
      # Opt-in rather than on-by-default is the load-bearing choice here, and it
      # cuts against "the platform should just do it for you". Scraping an app
      # that serves no /metrics produces a permanently-red Prometheus target
      # that nobody can fix from the platform side, and a permanently-red thing
      # in the monitoring UI is exactly the training signal that teaches an
      # operator to stop reading it. A missing target is honest; a failing one
      # that is *expected* to fail is corrosive. The Kubernetes-level half of
      # the signal (the PrometheusRule and the delivery row of the dashboard)
      # needs no app cooperation and is therefore NOT gated on this block.
      #
      # No separate metrics port. Every field here describes the app's own
      # `spec.port`, which is where the Prometheus client libraries these apps
      # use put /metrics by default. An app that genuinely serves metrics
      # elsewhere is an additive `port` field later, not a shape this revision
      # has to guess at.
      Metrics:
        enabled: boolean | default=false description="set true once the app actually serves Prometheus metrics"
        path: string | default="/metrics" description="path the app serves Prometheus metrics on, scraped on spec.port"
        interval: string | default="30s" description="scrape interval"
      #
      # DEFAULTING TRAP — this cost a live bug, and it applies to every custom
      # type in this file. kro emits `default: {}` on a custom-type field in the
      # generated CRD **whenever any of that type's sub-fields carries a
      # default**. The API server then materialises the whole block on every
      # instance that omits it, so `has(schema.spec.<field>)` is ALWAYS TRUE and
      # cannot gate anything.
      #
      # Revision 3 shipped `includeWhen: ${has(schema.spec.persistence)}` on
      # that basis and it never excluded a single instance: fastapi-echo, which
      # sets no persistence at all, was found holding a bound 1Gi PVC on the
      # `fast` tier plus a phantom /app/data mount — and since both tiers are
      # Retain, every such app would have left an orphaned PV behind on delete.
      # Found by testing rev 4's identical gate rather than by anything failing,
      # which is the point: this failure mode is silent in both directions.
      #
      # Confirmed empirically on the live cluster, both halves: `securityContext`
      # (no sub-field has a default) gets NO `default: {}` and gates correctly,
      # while `persistence` (three defaults) got one. So the rule is the
      # sub-fields, not the type.
      #
      # The fix, and the idiom to follow for any future block: gate on a LEAF
      # field that carries no default, never on the parent. `size` is that leaf
      # here — dropping its "1Gi" default is not a loss, since a platform cannot
      # honestly guess how much disk an app needs, and asking for persistence
      # without saying how much was never meaningful. `tier` and `mountPath`
      # keep their defaults. Metrics uses an explicit `enabled` boolean instead,
      # because a pure on/off feature has no such natural leaf and a flag reads
      # as the intent it is.
      Persistence:
        # No default — deliberately. See DEFAULTING TRAP above: this field's
        # absence IS the opt-out, so giving it a default would silently give
        # every app a volume it never asked for. Setting it is what asks.
        size: string | description="volume size, e.g. 1Gi — REQUIRED to enable persistence; omitting it is how an app opts out"
        tier: string | enum="fast,bulk" default="fast" description="fast = durable, low-latency, small; bulk = durable, high-capacity, sequential"
        mountPath: string | default="/app/data" description="path inside the container the volume is mounted at"
    spec:
      image: string | required=true
      port: integer | default=8000
      host: string | required=true description="Tailscale hostname, without the tailnet suffix"
      probePath: string | default="/healthz"
      size: string | enum="small,medium" default="small"
      # default=[] is required, not cosmetic — an app that omits this field
      # entirely (any app with no database, or the fastapi-echo/PFD cases
      # with no object storage / no database respectively) would otherwise
      # leave schema.spec.databases genuinely absent from the stored object,
      # and every CEL expression below that reads it (.map()/.filter()/
      # .all(), and both forEach blocks) fails at reconcile time with
      # "no such key: databases" — not a compile-time error, so it passed
      # GraphAccepted and only surfaced as ResourcesReady: False on the
      # first real instance that omitted the field. Confirmed against a live
      # cluster: default=[] makes kro populate a real empty list instead.
      databases: "[]DatabaseAttachment | default=[]"
      objectStorage: "[]ObjectStorageAttachment | default=[]"
      # Both optional custom-type fields below: a plain single-node-cluster
      # app (fastapi-echo) sets neither. Rendering is gated with has(...) in
      # the Deployment template — see the comment there for why a bare
      # ternary doesn't type-check in kro's CEL and dyn() is needed.
      securityContext: SecurityContext
      persistence: Persistence
      metrics: Metrics
    status:
      url: ${ingress.status.loadBalancer.ingress[0].hostname}
      availableReplicas: ${deployment.status.availableReplicas}
      # NOT named `ready`. kro publishes its own Ready *condition*, which is
      # True whenever the graph rendered successfully and says nothing about
      # whether attachment refs resolved — an instance with a typo'd ref still
      # reports Ready=True. A custom field named `ready` sits next to that
      # condition reading as authoritative while being shadowed in every
      # default table view. Verified during the LES-56 spike; named distinctly
      # so the two can't be confused.
      attachmentsResolved: >-
        ${schema.spec.databases.all(d, has(d.externalSecretName) ||
            size(databasesInNs.filter(x, x.metadata.name == d.ref)) > 0) &&
          schema.spec.objectStorage.all(o,
            size(objectStorageInNs.filter(x, x.metadata.name == o.ref)) > 0)}
      # One combined list across both attachment types, not
      # unresolvedDatabaseRefs/unresolvedObjectStorageRefs split in two.
      # Printer columns can't be added after the CRD is first created (see
      # below), so this had to be the shape from revision 1 — extending the
      # CEL here in revision 2 costs nothing; a second column would have
      # been unaddable.
      unresolvedRefs: >-
        ${schema.spec.databases.filter(d, !has(d.externalSecretName) &&
            size(databasesInNs.filter(x, x.metadata.name == d.ref)) == 0).map(d, d.ref) +
          schema.spec.objectStorage.filter(o,
            size(objectStorageInNs.filter(x, x.metadata.name == o.ref)) == 0).map(o, o.ref)}
    # CREATE-TIME ONLY — kro applies these when it first creates the CRD; on
    # an adopted CRD (which is what happens on every subsequent RGD revision,
    # since the CRD itself survives) changes here are silently ignored.
    # Confirmed during the LES-56 spike. These were therefore designed once,
    # for the columns this API needs across both revisions, not revised here.
    additionalPrinterColumns:
      - name: State
        type: string
        jsonPath: .status.state
      - name: Ready
        type: string
        jsonPath: .status.conditions[?(@.type=="Ready")].status
      - name: Resolved
        type: boolean
        jsonPath: .status.attachmentsResolved
      - name: Unresolved
        type: string
        jsonPath: .status.unresolvedRefs
      - name: URL
        type: string
        jsonPath: .status.url
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
  resources:
    # Attachment resolution, database side (unchanged from revision 1): a
    # collection externalRef fetching every Database in this instance's
    # namespace. `namespace` is NOT optional — see the original comment
    # preserved below.
    - id: databasesInNs
      externalRef:
        apiVersion: platform.homelab/v1alpha1
        kind: Database
        metadata:
          # kro lists across ALL namespaces when this is omitted on a
          # collection ref, which would let one app's Application resolve
          # another app's Database and wire in its credentials.
          namespace: ${schema.metadata.namespace}
          selector: {}

    # Attachment resolution, object-storage side. Same shape as above — kro
    # forbids forEach and externalRef on the same resource entry, so this
    # collection ref is its own entry; the S3Identity/S3Credentials/S3Policy/
    # S3PolicyBinding forEach below and the Deployment's env CEL both match
    # against this fetched collection rather than doing their own lookup.
    - id: objectStorageInNs
      externalRef:
        apiVersion: platform.homelab/v1alpha1
        kind: ObjectStorage
        metadata:
          namespace: ${schema.metadata.namespace}
          selector: {}

    # One S3Identity + S3Credentials + S3Policy + S3PolicyBinding set per
    # objectStorage[] entry — this is where forEach earns its keep, since
    # each attachment needs FOUR separate Kubernetes objects, not just an
    # env-var entry within one shared object (contrast with databases, which
    # only need the latter).
    #
    # Every consumer gets the same <app>-<alias>/* prefix scoping, including
    # a bucket's first and only consumer — no "full access for whoever got
    # there first." An Application instance only ever sees its own spec, with
    # no way to know whether it's the first attachment to a given
    # ObjectStorage, so uniform scoping is also the only implementable
    # option, not merely the fairest one.
    #
    # IAM identity/policy names are GLOBAL to the Seaweed cluster (confirmed
    # against the operator's Go source), unlike Kubernetes object names —
    # hence the namespace prefix on spec.name below. S3Credentials/
    # S3PolicyBinding have no such global-name field; their own
    # metadata.name only needs to be unique within this namespace.
    - id: s3Identities
      forEach:
        - attachment: ${schema.spec.objectStorage}
      template:
        apiVersion: seaweed.seaweedfs.com/v1
        kind: S3Identity
        metadata:
          name: ${schema.metadata.namespace + "-" + schema.metadata.name + "-" + attachment.as}
          namespace: ${schema.metadata.namespace}
        spec:
          seaweedRef:
            name: seaweed
            namespace: seaweedfs

    - id: s3Credentials
      forEach:
        - attachment: ${schema.spec.objectStorage}
      template:
        apiVersion: seaweed.seaweedfs.com/v1
        kind: S3Credentials
        metadata:
          name: ${schema.metadata.name + "-" + attachment.as + "-s3"}
          namespace: ${schema.metadata.namespace}
        spec:
          seaweedRef:
            name: seaweed
            namespace: seaweedfs
          identityRef:
            # Recomputed rather than read back from s3Identities — the name
            # is a pure function of (namespace, app name, alias), so there's
            # no need for a cross-collection dependency here.
            name: ${schema.metadata.namespace + "-" + schema.metadata.name + "-" + attachment.as}
          # Pinned explicitly rather than left to the operator's own default
          # (which happens to match "accessKey"/"secretKey" today) — a
          # future operator upgrade that changes the default fails loudly at
          # apply time instead of silently breaking every Application.
          secretRef:
            accessKeyField: accessKey
            secretKeyField: secretKey

    - id: s3Policies
      forEach:
        - attachment: ${schema.spec.objectStorage}
      template:
        apiVersion: seaweed.seaweedfs.com/v1
        kind: S3Policy
        metadata:
          name: ${schema.metadata.namespace + "-" + schema.metadata.name + "-" + attachment.as}
          namespace: ${schema.metadata.namespace}
        spec:
          seaweedRef:
            name: seaweed
            namespace: seaweedfs
          # policyDocument, not statements: S3PolicyStatement (the
          # structured form) has no condition field, so an s3:prefix-scoped
          # ListBucket grant — required for the prefix isolation this whole
          # design rests on — is only expressible as raw policy JSON.
          # Confirmed against the CRD's Go source, not assumed from AWS IAM
          # docs in general.
          policyDocument: >-
            ${'{"Version":"2012-10-17","Statement":[' +
              '{"Effect":"Allow","Action":["s3:ListBucket"],' +
              '"Resource":["arn:aws:s3:::' +
              objectStorageInNs.filter(o, o.metadata.name == attachment.ref).map(o, o.status.bucketName).join("") +
              '"],"Condition":{"StringLike":{"s3:prefix":["' +
              schema.metadata.name + "-" + attachment.as + '/*"]}}},' +
              '{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],' +
              '"Resource":["arn:aws:s3:::' +
              objectStorageInNs.filter(o, o.metadata.name == attachment.ref).map(o, o.status.bucketName).join("") +
              '/' + schema.metadata.name + "-" + attachment.as + '/*"]}' +
              ']}'}

    - id: s3PolicyBindings
      forEach:
        - attachment: ${schema.spec.objectStorage}
      template:
        apiVersion: seaweed.seaweedfs.com/v1
        kind: S3PolicyBinding
        metadata:
          name: ${schema.metadata.name + "-" + attachment.as}
          namespace: ${schema.metadata.namespace}
        spec:
          seaweedRef:
            name: seaweed
            namespace: seaweedfs
          policyRef:
            name: ${schema.metadata.namespace + "-" + schema.metadata.name + "-" + attachment.as}
          subjects:
            - kind: S3Identity
              name: ${schema.metadata.namespace + "-" + schema.metadata.name + "-" + attachment.as}

    # The backing claim for spec.persistence, created only when that field is
    # set. `includeWhen` is evaluated against the schema alone, before the graph
    # is built, so it can gate a resource on an optional field the way the
    # dyn(has(...)) ternaries below gate individual fields — confirmed against
    # the kro 0.9.3 CRD on the live cluster.
    #
    # NOTE the claim outlives the Application. Both offered tiers are
    # reclaimPolicy: Retain, so deleting an Application leaves its PV behind for
    # manual cleanup rather than destroying data — deliberate, and the same
    # treatment Database gets under D4. It does mean an app deleted and
    # recreated under the same name binds a fresh volume while the old one sits
    # Released; that is a cleanup chore, not data loss, which is the right way
    # round.
    - id: dataVolume
      includeWhen:
        - ${has(schema.spec.persistence.size)}
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${schema.metadata.name + "-data"}
          namespace: ${schema.metadata.namespace}
          # D4 classifies this as Durable — an app only asks for persistence
          # when losing the data would matter. Labelled on the PVC because PVs
          # do not inherit PVC labels, and the unlabelled-volume alerting D4
          # calls for has to look at claims.
          labels:
            platform.homelab/durability: durable
        spec:
          accessModes: ["ReadWriteOnce"]
          # The tier name IS the StorageClass name — the one place this API's
          # vocabulary and the cluster's coincide, because both were chosen to
          # describe the same guarantee. See infrastructure/storage/.
          storageClassName: ${schema.spec.persistence.tier}
          resources:
            requests:
              storage: ${schema.spec.persistence.size}

    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
            spec:
              # Optional, additive (revision 2). has(...) alone does not
              # type-check here — a bare ternary between a typed value and
              # `null` fails kro's static type checker with a type-mismatch
              # error (confirmed empirically: "found no matching overload
              # for '_?_:_'"), because CEL requires both ternary branches to
              # share a type and `null` isn't unifiable with `int`. dyn(...)
              # on both branches sidesteps that by making the ternary's
              # result type dyn, matching how kro itself resolves fields
              # against the real corev1 struct shape. Verified against a
              # live cluster: an instance with no securityContext set
              # renders {} on the pod (Kubernetes treats that identically to
              # the field being absent); one with it set renders exactly the
              # three values.
              securityContext:
                runAsUser: '${has(schema.spec.securityContext) ? dyn(schema.spec.securityContext.runAsUser) : dyn(null)}'
                runAsGroup: '${has(schema.spec.securityContext) ? dyn(schema.spec.securityContext.runAsGroup) : dyn(null)}'
                fsGroup: '${has(schema.spec.securityContext) ? dyn(schema.spec.securityContext.fsGroup) : dyn(null)}'
              containers:
                - name: ${schema.metadata.name}
                  image: ${schema.spec.image}
                  # No image-automation reconciler exists yet (unbuilt C3/D2),
                  # so tags are typically :latest and must re-pull on rollout.
                  imagePullPolicy: Always
                  ports:
                    - containerPort: ${schema.spec.port}
                  # Attachment resolution, part 2 of 2 for databases, and the
                  # whole story for objectStorage's env wiring (its four
                  # rendered IAM objects come from the forEach blocks above;
                  # this only wires the resulting Secret/derived values into
                  # env vars). No forEach needed for either half — this
                  # produces entries within the one Deployment object, not
                  # separate Kubernetes objects.
                  #
                  # Explicit env with single-key secretKeyRefs throughout,
                  # never envFrom — CloudNativePG's <cluster>-app Secret
                  # carries host/user/password/dbname alongside uri, and
                  # envFrom would dump all of them as bare variables.
                  #
                  # Always alias-suffixed on both sides, no bare-name special
                  # case for a one-item list — a bare DATABASE_URL or
                  # AWS_ACCESS_KEY_ID would have to disappear the day a
                  # second attachment is added, and an SDK's default
                  # credential chain has no way to know which of two buckets
                  # a bare var would mean anyway.
                  #
                  # Each objectStorage[] entry also gets S3_PREFIX_<ALIAS> —
                  # the exact key prefix that entry's S3Policy actually scopes
                  # access to. Not just documentation: a bare HeadBucket/
                  # ListBucket with no prefix is correctly AccessDenied under
                  # the prefix-conditioned policy (confirmed live — this is
                  # the isolation working as designed, not a bug), so any app
                  # doing its own connectivity check needs this value to test
                  # against a call its own credentials actually cover, rather
                  # than hardcode this platform's <app>-<alias> naming
                  # convention. Same "expose the derived value" reasoning as
                  # S3_BUCKET_X.
                  env: >-
                    ${schema.spec.databases.map(d, {
                      "name": "DATABASE_URL_" + d.as.upperAscii().replace("-", "_"),
                      "valueFrom": {
                        "secretKeyRef": {
                          "name": has(d.externalSecretName) ? d.externalSecretName : d.ref + "-app",
                          "key": has(d.externalSecretName) ? d.externalSecretKey : "uri"
                        }
                      }
                    }) + schema.spec.objectStorage.map(o, [
                      {
                        "name": "S3_ENDPOINT_" + o.as.upperAscii().replace("-", "_"),
                        "value": "http://seaweed-s3.seaweedfs.svc:8333"
                      },
                      {
                        "name": "S3_BUCKET_" + o.as.upperAscii().replace("-", "_"),
                        "value": objectStorageInNs.filter(x, x.metadata.name == o.ref).map(x, x.status.bucketName).join("")
                      },
                      {
                        "name": "AWS_ACCESS_KEY_ID_" + o.as.upperAscii().replace("-", "_"),
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": schema.metadata.name + "-" + o.as + "-s3",
                            "key": "accessKey"
                          }
                        }
                      },
                      {
                        "name": "AWS_SECRET_ACCESS_KEY_" + o.as.upperAscii().replace("-", "_"),
                        "valueFrom": {
                          "secretKeyRef": {
                            "name": schema.metadata.name + "-" + o.as + "-s3",
                            "key": "secretKey"
                          }
                        }
                      },
                      {
                        "name": "S3_PREFIX_" + o.as.upperAscii().replace("-", "_"),
                        "value": schema.metadata.name + "-" + o.as
                      }
                    ]).flatten()}
                  readinessProbe:
                    httpGet:
                      path: ${schema.spec.probePath}
                      port: ${schema.spec.port}
                    initialDelaySeconds: 2
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: ${schema.spec.probePath}
                      port: ${schema.spec.port}
                    initialDelaySeconds: 5
                    periodSeconds: 20
                  resources:
                    requests:
                      cpu: '${schema.spec.size == "small" ? "50m" : "100m"}'
                      memory: '${schema.spec.size == "small" ? "64Mi" : "256Mi"}'
                    limits:
                      cpu: '${schema.spec.size == "small" ? "200m" : "1000m"}'
                      memory: '${schema.spec.size == "small" ? "128Mi" : "1Gi"}'
                  # Optional, additive (revision 2). Lists turn out to need
                  # the same dyn() treatment objects do: an all-string map
                  # literal like {"name":..., "mountPath":...} infers as
                  # map(string,string), and kro's type checker still
                  # unifies that against the real VolumeMount struct (which
                  # has a bool readOnly field) even inside a list — the
                  # empty-list branch doesn't save it. Confirmed
                  # empirically after the object case's dyn() fix didn't
                  # extend to lists on its own.
                  volumeMounts: >-
                    ${dyn(has(schema.spec.persistence.size) ? [{
                      "name": "data",
                      "mountPath": schema.spec.persistence.mountPath
                    }] : [])}
              # claimName is RECOMPUTED here rather than read back as
              # ${dataVolume.metadata.name}. That is not a style choice: a
              # reference to a conditionally-included resource creates a graph
              # dependency that has to resolve even on instances where the
              # resource is excluded. The name is a pure function of the
              # instance name, so recomputing it keeps this Deployment
              # independent of whether the PVC was included — the same reasoning
              # as identityRef in s3Credentials above.
              volumes: >-
                ${dyn(has(schema.spec.persistence.size) ? [{
                  "name": "data",
                  "persistentVolumeClaim": {
                    "claimName": schema.metadata.name + "-data"
                  }
                }] : [])}

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          selector:
            app: ${schema.metadata.name}
          ports:
            - port: 80
              targetPort: ${schema.spec.port}

    - id: ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          ingressClassName: tailscale
          # Hostname comes from spec.tls[].hosts, not metadata.name — the
          # convention this repo's other ingresses already follow. The operator
          # fills in the full tailnet FQDN, which status.url reads back.
          tls:
            - hosts:
                - ${schema.spec.host}
          rules:
            - http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${schema.metadata.name}
                        port:
                          number: 80

    # ---- Ingress lockdown (revision 5) --------------------------------------
    #
    # This is what makes the `Tailscale-User-Login` header worth reading.
    #
    # The Tailscale operator injects `Tailscale-User-Login` / `-User-Name` /
    # `-User-Profile-Pic` into every request it proxies, with no configuration.
    # Tailscale's own guidance is that those headers are trustworthy only if the
    # backend cannot be reached except through the proxy — its stated form,
    # "have the service listen on localhost", has no Kubernetes equivalent. On a
    # flat pod network any pod in the cluster can hit this app's Service
    # directly and set whatever it likes in that header. A NetworkPolicy is the
    # substitute for the localhost bind, and it is a precondition rather than a
    # hardening extra: without it the header is a claim, not an identity.
    #
    # ALWAYS RENDERED, not opt-in. LES-64 originally proposed a per-app opt-in
    # label mirroring `platform.homelab/seaweedfs-access`, and that convention
    # predates this API — an Application has exactly one Service and exactly one
    # `tailscale` Ingress by construction, so the platform already knows the
    # complete set of legitimate callers without asking. An opt-in security
    # control also has to be adopted app-by-app in repos this one does not own
    # (zero-touch registration, docs/zero-touch-app-registration.md), which is
    # the same as saying it would protect whichever apps happened to remember.
    #
    # The cost of always-on, stated plainly: an Application whose pods need
    # ingress from something other than its own proxy or Prometheus — another
    # app calling it as an internal API, say — breaks, and breaks as a
    # connection timeout with nothing on either object naming this policy. No
    # app on this cluster does that today. The fix when one does is an additive
    # `spec.allowFrom` block here, not a hand-written policy in the app's repo,
    # which kro would leave alone but which would drift out of this document.
    #
    # SELECTOR PRECISION, and its dependency on LES-103. The `from` block below
    # names THIS app's own proxy pod: the operator labels each one
    # `tailscale.com/parent-resource=<ingress name>` +
    # `parent-resource-ns=<app namespace>` + `parent-resource-type=ingress`, and
    # an Application's Ingress is named after the instance, so the match is
    # exact. Another app's proxy is not permitted, which matters because a proxy
    # is precisely the thing whose header injection is believed.
    #
    # If the app exposures ever move to a shared ProxyGroup, those labels become
    # `parent-resource=<proxygroup>` / `parent-resource-type=proxygroup` and
    # this rule matches nothing — every Application would break at once. It is
    # not a bypass but it does coarsen the achievable rule to "some Tailscale
    # ingress proxy", since a pooled proxy serves every app. Whoever does that
    # migration edits this block in the same change.
    #
    # Ingress only, no egress rules. Egress default-deny is a much larger
    # commitment (every app needs DNS, its database, SeaweedFS, and whatever it
    # calls outbound) and it is not what the header question turns on. Adding a
    # `policyTypes` entry for egress here later would put every Application into
    # egress default-deny simultaneously; see the DNS-shaped failure recorded in
    # docs/networkpolicy-enforcement-notes.md before considering it.
    #
    # The kubelet's probes are NOT allowed here and do not need to be — they
    # arrive from 10.244.0.1 classified as `world` under CNI chaining, and
    # infrastructure/cilium/allow-node-to-pods.yaml permits that cluster-wide.
    # Without that file this policy crash-loops every Application on the
    # cluster, which is the single most important thing to know before editing
    # either one.
    - id: networkPolicy
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          # Selects the app's pods only. A Database attachment's CNPG pods live
          # in the same namespace and carry different labels, so they are not
          # selected and their own connectivity is untouched.
          podSelector:
            matchLabels:
              app: ${schema.metadata.name}
          policyTypes:
            - Ingress
          ingress:
            # 1 — this app's own Tailscale ingress proxy. The only path that
            # can carry an identity header, and now the only path in at all.
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: tailscale
                  podSelector:
                    matchLabels:
                      tailscale.com/parent-resource: ${schema.metadata.name}
                      tailscale.com/parent-resource-ns: ${schema.metadata.namespace}
                      tailscale.com/parent-resource-type: ingress
              ports:
                - protocol: TCP
                  port: ${schema.spec.port}
            # 2 — Prometheus. Unconditional, NOT gated on spec.metrics.enabled:
            # gating would make enabling metrics a two-step change where the
            # PodMonitor lands and then scrapes nothing but connection timeouts,
            # and the failure would read as an app fault. `observability` is a
            # platform namespace whose contents this repo controls, and reaching
            # a /metrics endpoint is not a route through which an identity
            # header can be forged — the app is behind the proxy either way.
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: observability
              ports:
                - protocol: TCP
                  port: ${schema.spec.port}

    # ---- Telemetry (revision 4) ---------------------------------------------
    #
    # A PodMonitor, not a ServiceMonitor. Both would work, and ServiceMonitor is
    # the more common choice, but PodMonitor is what this repo already uses for
    # the same job (rgd-database.yaml) and it scrapes the pod directly rather
    # than through a Service whose one port exists to serve user traffic.
    #
    # `portNumber` rather than `port` matters more than it looks. Selecting the
    # scrape target by NAME would require naming the container port in the
    # Deployment above, and any edit to a pod template rolls every running
    # instance — so a revision that is otherwise pure addition would have
    # restarted every app on the cluster to gain a name nothing else reads.
    # portNumber targets the same port by value and leaves the pod template
    # untouched. Confirmed present on this cluster's installed PodMonitor CRD,
    # not assumed from upstream docs.
    - id: podMonitor
      includeWhen:
        - ${schema.spec.metrics.enabled}
      template:
        apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            # REQUIRED, not decoration — the same trap as the Database RGD's
            # PodMonitor. podMonitorSelector is {release: kube-prometheus-stack}
            # and podMonitorNamespaceSelector is {} (both verified live), so
            # this label is the whole difference between "scraped from any
            # namespace" and "created successfully and silently never scraped."
            release: kube-prometheus-stack
        spec:
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          podMetricsEndpoints:
            - portNumber: ${schema.spec.port}
              path: ${schema.spec.metrics.path}
              interval: ${schema.spec.metrics.interval}

    # Unconditional, unlike the PodMonitor above: every rule here is derived
    # from kube-state-metrics and the kubelet, so it fires correctly for an app
    # that exposes nothing at all. That asymmetry is the point — an app author
    # gets the alerts that need no cooperation for free, and opts in only to the
    # part that genuinely requires work in their own code.
    #
    # Deliberately NOT here: request-rate/error-rate/latency alerting. Those
    # need a metric-name contract the platform cannot enforce, and thresholds
    # that are per-app judgement calls; a wrong threshold shipped platform-wide
    # is worse than no alert. The RED signals get a dashboard (read when you are
    # already looking) rather than an alert (interrupts you).
    #
    # NOTE these alerts currently fire into a black hole — Alertmanager's
    # receiver is still `null` (LES-69), so they are visible in the Prometheus
    # and Alertmanager UIs and nowhere else. Still worth landing: LES-69 is a
    # delivery-side fix, and this way it lands into a cluster that already has
    # something to deliver.
    - id: alerts
      template:
        apiVersion: monitoring.coreos.com/v1
        kind: PrometheusRule
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          labels:
            release: kube-prometheus-stack
        spec:
          groups:
            - name: ${"platform.application." + schema.metadata.name}
              rules:
                # Availability, from the Deployment's own status. Catches the
                # whole family of "it is not serving" causes — image pull
                # failure, admission rejection, unschedulable, failing
                # readiness — with one rule, because all of them end at zero
                # available replicas.
                #
                # 10m, not 5m: a rollout with imagePullPolicy: Always on this
                # node routinely takes minutes, and an alert that fires on every
                # normal deploy is one that gets muted.
                - alert: ApplicationNotAvailable
                  # Single-quoted CEL strings, so the PromQL's own double quotes
                  # survive unescaped — the same reason rgd-application.yaml's
                  # S3 policyDocument is written this way.
                  expr: >-
                    ${'kube_deployment_status_replicas_available{namespace="' +
                      schema.metadata.namespace + '",deployment="' +
                      schema.metadata.name + '"} == 0'}
                  for: 10m
                  labels:
                    severity: critical
                    platform_application: ${schema.metadata.name}
                  annotations:
                    summary: ${schema.metadata.name + " has no available replicas"}
                    description: >-
                      ${"Deployment " + schema.metadata.namespace + "/" + schema.metadata.name +
                        " has reported 0 available replicas for 10 minutes, so it is not serving " +
                        schema.spec.host + ". Start with `kubectl describe deploy -n " +
                        schema.metadata.namespace + " " + schema.metadata.name + "`."}

                # Restart looping. Separate from the rule above because the two
                # fail differently: an app that crashes and recovers within the
                # restart backoff can keep a replica available for most of every
                # minute and never trip ApplicationNotAvailable, while dropping
                # in-flight requests the whole time.
                - alert: ApplicationRestartLooping
                  expr: >-
                    ${'increase(kube_pod_container_status_restarts_total{namespace="' +
                      schema.metadata.namespace + '",container="' +
                      schema.metadata.name + '"}[15m]) > 3'}
                  for: 5m
                  labels:
                    severity: warning
                    platform_application: ${schema.metadata.name}
                  annotations:
                    summary: ${schema.metadata.name + " is restart looping"}
                    description: >-
                      ${"A container in " + schema.metadata.namespace + "/" + schema.metadata.name +
                        " restarted more than 3 times in 15 minutes. Its liveness probe (" +
                        schema.spec.probePath + ") or the process itself is failing. Previous logs: " +
                        "`kubectl logs -n " + schema.metadata.namespace + " deploy/" +
                        schema.metadata.name + " --previous`."}

                # Memory headroom. The PLATFORM sets the limits (from
                # spec.size), so an app author never chose 128Mi and has no
                # reason to expect it — which makes an OOMKill land as an
                # unexplained restart rather than as "you need the next size
                # up". This rule turns the second into the first, and fires
                # before the kill rather than after it.
                #
                # Deliberately no CPU equivalent: hitting the CPU limit
                # throttles, which is a latency problem the dashboard shows
                # honestly, not a liveness event worth an alert.
                - alert: ApplicationMemoryNearLimit
                  expr: >-
                    ${'max by (pod) (container_memory_working_set_bytes{namespace="' +
                      schema.metadata.namespace + '",container="' + schema.metadata.name +
                      '"} / on (pod, container) group_left() ' +
                      'kube_pod_container_resource_limits{namespace="' +
                      schema.metadata.namespace + '",container="' + schema.metadata.name +
                      '",resource="memory"}) > 0.9'}
                  for: 15m
                  labels:
                    severity: warning
                    platform_application: ${schema.metadata.name}
                  annotations:
                    summary: ${schema.metadata.name + " is within 10% of its memory limit"}
                    description: >-
                      ${"Working set has been above 90% of the memory limit for 15 minutes, so " +
                        schema.metadata.namespace + "/" + schema.metadata.name +
                        " is heading for an OOMKill. The limit comes from spec.size (currently " +
                        schema.spec.size + ") — raise it there, not on the Deployment, which kro " +
                        "will revert."}
