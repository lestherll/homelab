# One shared Seaweed cluster — the "seaweedfs" analogue of the shared
# CloudNativePG operator: platform-owned infrastructure, not a self-service
# type. ObjectStorage instances (infrastructure/platform-api/rgd-objectstorage.yaml)
# provision Buckets against this cluster by name.
#
# Server image pinned explicitly — chrislusf/seaweedfs is still the
# canonical published image (confirmed against the operator's own README and
# sample manifests); re-verified against
# https://github.com/seaweedfs/seaweedfs/releases as of 2026-08-10: latest
# stable is 4.41.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
  namespace: seaweedfs
spec:
  image: chrislusf/seaweedfs:4.41

  master:
    replicas: 1
    # metricsPort only enables a Prometheus scrape endpoint on the pod — it
    # does NOT by itself get this cluster's Prometheus to scrape it (see
    # the PodMonitors below, and the comment on those for why). Picked from
    # a plain sequential block (9410-9413), deliberately not reusing any of
    # the operator's documented default HTTP/gRPC ports (9333, 8444, 8888,
    # 8333, 8181, 23646, 9101, 2222) to avoid inviting a misread.
    metricsPort: 9410
    # NOT COSMETIC — the cluster does not work without this. Left unset, the
    # build's own default (visible in its startup banner as "30GB") produces
    # a Max of only 2 writable volume slots on this node's disk, and
    # SeaweedFS assigns volumes per-collection (one Bucket = one collection).
    # The first bucket claims both slots at cluster bootstrap, so every
    # subsequent bucket's first write fails with "No writable volumes and no
    # free volumes left" — a 500 InternalError from the S3 API, not an
    # AccessDenied, so it doesn't even look like a quota problem. Reproduced
    # and root-caused against a live cluster (dir/status showed Max: 2,
    # Free: 0) before this value was set; confirmed fixed afterwards
    # (Max: 604, Free: 602 against this node's actual free disk — local-path
    # PVCs aren't quota-enforced, so SeaweedFS sees the whole node's free
    # space divided by this value, not the 5Gi volume.requests below).
    # 100 keeps each volume container small enough to give real multi-bucket
    # headroom on a homelab-sized disk — this caps the size SeaweedFS rolls a
    # volume container over at, not the size of an individual stored object
    # (large files are chunked across volumes by the filer regardless), but
    # that chunking behavior was not itself re-verified here — worth an
    # explicit test the first time a genuinely large object is stored.
    volumeSizeLimitMB: 100
    # Sized 2026-08-21 against two days of live metrics: 2m / 177Mi, and
    # 177Mi is the *steady state*, not a peak. An earlier reading of 31Mi was
    # taken from a previous container; memory stepped up ~145Mi at some point
    # in the last two days and has held 175-179Mi continuously since, so the
    # request covers that level rather than the pre-step one and the limit is
    # headroom above it. Every component here ran with no requests and no
    # limits until now, which meant the scheduler accounted this cluster as
    # free and nothing capped it — see the note on `volume` below for why an
    # uncapped SeaweedFS is the one worth fixing first.
    #
    # NOTE the operator flattens `requests`/`limits` straight into the
    # container's ResourceRequirements — there is no `resources:` wrapper,
    # and these are the same two maps `volume` uses for its PVC size. The
    # operator's filterContainerResources() strips only the `storage` key on
    # its way to the container (confirmed in internal/controller/helper.go
    # against 1.0.34), which is what lets storage and compute share one map
    # without the container spec being rejected.
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # PVC-backed, on the bulk tier: volume data is the platform's own
  # analogue of a Postgres PGDATA volume — losing it loses every object in
  # every bucket. Labelled durable for the same reason CNPG's storage is
  # (D4), so unlabelled-volume alerting (once built) doesn't miss it.
  #
  # Bulk tier (the 931G spinning disk) rather than the SSD: object storage is
  # the one component here designed to grow without bound, and its access
  # pattern is large and sequential — the case the HDD is good at. Note this
  # also changes what the volumeSizeLimitMB note above computes against:
  # SeaweedFS sizes Max writable slots off the *backing filesystem's* free
  # space, which is the `bulk` UserVolume's 100 GiB — not the whole 931G disk
  # the image file sits on, and not the node's root filesystem. At 100MB per
  # volume container that is ~1000 slots, which is the multi-bucket headroom
  # the note above exists to protect.
  volume:
    replicas: 1
    # `storage` sizes the PVC; `cpu`/`memory` size the container. One map,
    # two destinations — see the note on `master` above.
    #
    # Sized 2026-08-21: steady state 1m / 30Mi, 2d peak 3m / 52Mi. The
    # memory limit is deliberately far above that, because this is the one
    # component whose footprint tracks stored data — the needle index is
    # held in memory, so it grows with object count. 512Mi is a ceiling that
    # stops a runaway from taking
    # the node, not a prediction; revisit it when real objects land, since
    # today's 52Mi peak is measured against an essentially empty cluster.
    # Note the cap's failure mode: this is the sole replica of every stored
    # object, so index growth past the limit is an OOMKill of the only copy,
    # not a throttle. Nothing alerts on approaching it today (LES-126).
    requests:
      # RESIZED WITH THE LONGHORN CUTOVER, and it had to move in the same
      # change rather than as a follow-up.
      #
      # volumeSizeLimitMB: 100 sizes writable slots off the backing
      # filesystem's FREE SPACE. Under local-path that was the whole bulk tier
      # — roughly 100 GiB, hence the "~1000 volume containers" this comment
      # used to claim — because a hostPath PV reported the host filesystem and
      # the 5Gi request was documentation. A Longhorn volume is a real block
      # device, so the arithmetic runs against the request instead: 5Gi would
      # have meant ~50 slots, not ~1000.
      #
      # The failure that would cause is the one already root-caused live once:
      # "No writable volumes and no free volumes left", surfacing as a 500 from
      # the S3 API that does not read as a capacity problem at all.
      #
      # 20Gi gives ~200 slots, which is ample here and honest about the disk it
      # sits on. Raise it, or lower volumeSizeLimitMB, before object count gets
      # near that.
      storage: 20Gi
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
    storageClassName: bulk
    labels:
      platform.homelab/durability: durable
    metricsPort: 9411

  filer:
    replicas: 1
    # Sized 2026-08-21: steady state 5m / 140Mi, 2d peak 6m / 141Mi — flat,
    # and the second heaviest of the four. Like `volume`, its memory tracks
    # stored data (leveldb2 index + cache), so the limit is set for growth
    # rather than against today's number, while the request covers the
    # steady state it already sits at.
    #
    # Compute only here — the filer's disk size comes from
    # `persistence.resources` below, not from this map.
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
    # Metadata store: same leveldb2 shape the operator's own sample uses.
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"
    # Filer metadata (bucket registry, directory structure) is as load-
    # bearing as the volume data above — without persistence it lives only
    # in the pod's writable layer and is lost on every restart. Same
    # durability treatment as volume, above.
    #
    # Deliberately stays on the `fast` tier while volume data sits on `bulk`:
    # this is a leveldb index, so it's small (340K against the volume's 468K at
    # the time of the split) and random-access — every object lookup pays its
    # latency. It's the opposite access pattern to the bulk data it indexes, and
    # a 5400rpm disk is the wrong home for it regardless of how large the
    # objects themselves get.
    persistence:
      enabled: true
      storageClassName: fast
      resources:
        requests:
          storage: 1Gi
      labels:
        platform.homelab/durability: durable
    metricsPort: 9412
    # filer.s3 (embedded S3+IAM on the filer itself) is deliberately left
    # unset. spec.s3 below is the standalone-Deployment gateway — the
    # operator's own doc comment says to prefer it for new clusters, since
    # embedded filer S3 cannot scale independently and is being phased out.

  # Standalone S3 gateway — the recommended path, not filer.s3.enabled.
  # IAM defaults to true (embedded on this same port), which is what makes
  # S3Identity/S3Credentials/S3Policy/S3PolicyBinding work at all.
  s3:
    replicas: 1
    # Sized 2026-08-21: steady state 1m / 32Mi, 2d peak 4m / 130Mi — that
    # spike is on the pod running now, so it is a real startup/burst figure
    # and not a stale container's. A stateless gateway: its footprint tracks
    # request concurrency, not stored data, so the limit is set well clear of
    # that spike rather than close to it — s3 OOMKilling takes the whole
    # ObjectStorage API down, and nothing here has yet driven concurrent
    # multipart traffic through it.
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 384Mi
    metricsPort: 9413
    # Setting metricsPort here also makes the operator auto-provision a
    # ServiceMonitor (confirmed in the operator's Go source — S3 and SFTP
    # are the only two components documented to do this). It is left in
    # place rather than suppressed — there's no field to disable it — but
    # it carries only the operator's fixed app.kubernetes.io/* labels, not
    # this cluster's required `release: kube-prometheus-stack`, so it is
    # never selected by Prometheus. It's inert, not wrong; the PodMonitors
    # below are what actually get this cluster scraped, for every
    # component uniformly, matching the Database RGD's own PodMonitor
    # rather than leaning on inconsistent per-component operator behavior.
