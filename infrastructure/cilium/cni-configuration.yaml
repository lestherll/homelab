# The chained CNI conflist Cilium installs on the node, and the reason this
# component is two objects rather than one HelmRelease.
#
# `cni.customConf: true` tells Cilium's install-cni container not to generate a
# config of its own but to write THIS ConfigMap's `cni-config` key verbatim to
# /etc/cni/net.d/05-cilium.conflist. The `05-` prefix sorts before Flannel's
# `10-flannel.conflist`, and kubelet uses the lexically first file in that
# directory — so this file is what takes effect and Flannel's own conflist stays
# on disk, unused, as the fallback if Cilium is ever removed.
#
# The first two plugin entries are Flannel's conflist copied verbatim off the
# live node (`talosctl read /etc/cni/net.d/10-flannel.conflist`). They must stay
# byte-identical to what Flannel emits: this file replaces Flannel's config, so
# anything dropped here is a capability the cluster silently loses. `portmap` in
# particular is what makes hostPort work.
#
# `name` MUST match Flannel's ("cbr0") — the CNI result is keyed on it, and a
# mismatch fails at pod creation, not at apply.
#
# The third entry is the whole point: cilium-cni in `generic-veth` mode attaches
# eBPF policy programs to the veth Flannel already created. It does no IPAM and
# no routing; Flannel keeps both. See docs/networkpolicy-enforcement-notes.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-configuration
  namespace: kube-system
data:
  cni-config: |-
    {
      "name": "cbr0",
      "cniVersion": "1.0.0",
      "plugins": [
        {
          "type": "flannel",
          "delegate": {
            "hairpinMode": true,
            "isDefaultGateway": true
          }
        },
        {
          "type": "portmap",
          "capabilities": {
            "portMappings": true
          }
        },
        {
          "type": "cilium-cni",
          "chaining-mode": "generic-veth"
        }
      ]
    }
