# Cilium — the only CNI, and the only thing programming Services.
#
# It arrived for one reason: Talos defaults to Flannel, Flannel has no policy
# backend, so every NetworkPolicy in this repo was inert until Cilium landed
# (docs/networkpolicy-enforcement-notes.md). Do not read a NetworkPolicy
# manifest predating that as evidence anything was ever enforced.
#
# It ran in generic-veth CHAINING mode over Flannel until the fleet migration. It no longer
# does: Talos renders no CNI and no kube-proxy, and this replaces both. That
# was a net deletion — two Talos-managed components gone, two files in this
# directory gone, and a ~35-line kube-proxy metrics workaround gone from the
# Terraform module.
#
# CAVEAT that outlives the change: cluster.network.cni.name and
# cluster.proxy.disabled are Talos BOOTSTRAP MANIFESTS, and AGENT.md records
# that those do not retrofit a running cluster — Talos re-renders them, reports
# no error, and leaves the live objects untouched. They landed on the machine 2
# build because that was a fresh bootstrap. Changing them again means a
# rebuild, not an apply.
#
# Chart version re-verified against https://helm.cilium.io/index.yaml as of
# 2026-08-17: 1.20.0 (appVersion 1.20.0).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  # kube-system, not a namespace of its own: Talos enforces PodSecurity
  # `baseline` cluster-wide and exempts exactly one namespace, kube-system.
  # The agent is privileged and hostNetwork, so anywhere else needs an explicit
  # `pod-security.kubernetes.io/enforce: privileged` label — one more thing to
  # get wrong on the component that, if it fails, takes pod networking with it.
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    # --- Datapath ------------------------------------------------------------
    # Cilium is the ONLY CNI here. Talos renders neither Flannel nor kube-proxy
    # (cluster.network.cni.name=none, cluster.proxy.disabled=true in
    # terraform/modules/talos-metal/), so there is nothing to chain onto and
    # nothing programming Services but this.
    #
    # THE TRADE, stated because it is easy to inherit without noticing: Cilium
    # used to be additive — if it failed, Flannel's conflist was still on disk
    # and the cluster kept routing without policy enforcement. That fallback is
    # gone. A Cilium failure is now a total network failure, and because
    # kubeProxyReplacement also puts Service routing in its datapath, that
    # includes pods reaching the API server. KubePrism keeps the NODE's path to
    # the API server independent, which is what still makes recovery possible.
    # One component that must work, instead of three that must agree.
    ipam:
      mode: kubernetes
    routingMode: native
    # Valid because the fleet migration puts every machine on one bridged LAN, so nodes are
    # L2-adjacent and pod traffic routes directly with no overlay. If that ever
    # stops being true the fallback is tunnel mode — one value, not a redesign.
    autoDirectNodeRoutes: true
    # Must agree with the pod CIDR Talos hands out via ipam.mode=kubernetes.
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    # Cilium masquerades now. Under chaining this was false because Flannel did
    # it, and two components doing it double-NATs egress.
    enableIPv4Masquerade: true
    enableIPv6Masquerade: false
    # Replaces kube-proxy outright. This is what lets cluster.proxy.disabled
    # be true; the two settings are one decision made in two files.
    kubeProxyReplacement: true

    # --- Talos constraints ---------------------------------------------------
    # Talos forbids workloads mounting cgroups; the host already has cgroup v2
    # mounted at the standard path, so point Cilium at it instead.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    securityContext:
      capabilities:
        # The chart defaults verbatim, minus SYS_MODULE: Talos does not let a
        # workload load kernel modules, and the agent crash-loops asking for a
        # capability it cannot be granted. Kept as an explicit list rather than
        # a patch so a chart bump that adds a capability shows up in a diff.
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - SYSLOG
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    # KubePrism, Talos's node-local apiserver load balancer (verified listening
    # on 127.0.0.1:7445). The agent reaches the apiserver without going through
    # kube-proxy, so it can still come up if Service routing is what is broken.
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # --- Observability -------------------------------------------------------
    # Hubble is here because of HOW this failed: a policy that enforces nothing
    # looks exactly like a policy that allows everything. Exporting the
    # policy-verdict and drop metrics means "was this connection allowed, and by
    # what" is answerable from Prometheus instead of by experiment.
    hubble:
      enabled: true
      metrics:
        enabled:
          - "policy:sourceContext=app|workload-name|pod;destinationContext=app|workload-name|pod;labelsContext=source_namespace,destination_namespace"
          - "drop:sourceContext=app|workload-name|pod;destinationContext=app|workload-name|pod;labelsContext=source_namespace,destination_namespace"
        serviceMonitor:
          enabled: true
          # kube-prometheus-stack's Prometheus selects ServiceMonitors on this
          # label in any namespace; without it the monitor is created and
          # silently never scraped.
          labels:
            release: kube-prometheus-stack
      # relay and ui are off: on one node `kubectl exec -n kube-system ds/cilium
      # -- hubble observe` reads the same flows directly, and the UI would want
      # a `tailscale` Ingress — which costs a Let's Encrypt order every time it
      # is recreated (see AGENT.md).
      relay:
        enabled: false
      ui:
        enabled: false

    # --- Footprint -----------------------------------------------------------
    # Stated rather than left implicit so the platform's cost stays visible in
    # git and a chart bump cannot change it without showing up in a diff.
    operator:
      # The chart defaults to 2 for HA. Single node: the second replica sits
      # Pending forever against podAntiAffinity.
      replicas: 1
      resources:
        requests: { cpu: 25m, memory: 96Mi }
        limits: { cpu: 500m, memory: 256Mi }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      # Deliberately generous, and deliberately not lower. The agent owns the
      # datapath — an OOMKill here is a networking outage, not a restarted pod.
      limits: { cpu: 2000m, memory: 768Mi }
