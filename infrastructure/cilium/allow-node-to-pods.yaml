# Without this, every default-deny ingress policy on this cluster also denies
# the kubelet's own liveness and readiness probes, and the workload dies.
#
# The usual reasoning — "probes come from the host netns, and Cilium allows the
# `host` identity by default" — is FALSE here, and it is chaining that makes it
# false. Cilium learns the node's addresses from the Node object and from the
# devices it manages. Under chaining it manages neither the bridge Flannel
# creates nor its address, so probes arriving from `cni0` at 10.244.0.1 are
# classified `world`, indistinguishable from traffic off the internet, and a
# default-deny drops them.
#
# Observed, not theorised. Restarting Flux's controllers under its own
# (previously inert) `allow-egress` policy put all four into a probe-failure
# crash loop while the processes inside were healthy and reconciling normally:
#
#   10.244.0.1:50492 (world) <> flux-system/notification-controller:9440
#     Policy denied DROPPED (TCP Flags: SYN)
#
# That is the signature. A workload that crash-loops on probe timeouts shortly
# after a policy starts selecting it is this, not the workload.
#
# Scope: 10.244.0.1/32 is one address — the node's own gateway address on the
# pod network, the source of every probe. It is not the pod CIDR and grants no
# pod anything. Cluster-wide and cluster-scoped on purpose: it is an invariant
# of running policy on this topology, not a property of any one namespace, and
# a namespaced copy would have to be remembered every time a namespace is
# created — which is exactly the kind of thing that gets forgotten and then
# debugged as an application fault.
#
# This is Cilium's CRD rather than a plain NetworkPolicy because a
# NetworkPolicy cannot express it: `ipBlock` is only meaningful alongside a
# rule that already selects the pods, so it would have to be repeated inside
# every policy anyone ever writes here.
#
# If Flannel is ever replaced by Cilium outright, this becomes unnecessary —
# Cilium would own the bridge and classify the address as `host`. Delete it
# then, and re-run a probe-dependent workload under a default-deny to confirm.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-node-to-pods
spec:
  # Every endpoint, including ones in namespaces that do not exist yet.
  endpointSelector: {}
  ingress:
    - fromCIDR:
        - 10.244.0.1/32
