apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # First, so that on a cold apply Flux can report its own failures as early as
  # possible. The notification CRDs come from the Flux install itself, not from
  # anything under here, so this has no dependency to wait on.
  - flux-notifications
  - sources
  - metrics-server
  - tailscale-operator
  - observability
  - victoria-metrics
  - fastapi-echo
  - personal-finance-dashboard
  - storage
  - postgres
  - kro
  - seaweedfs
  # platform-api is deliberately NOT here — its RGDs need kro's CRD, which this
  # same Kustomization installs. See clusters/homelab/infrastructure-platform-api.yaml.
