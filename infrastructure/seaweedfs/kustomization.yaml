# Operator install only — namespace + HelmRelease. Mirrors
# infrastructure/postgres/'s shape exactly, and for the same reason: the
# Seaweed cluster CR / ResourceReferenceGrant / PodMonitors that depend on
# this operator's CRDs deliberately do NOT live here. See
# infrastructure/seaweedfs-runtime/ and clusters/homelab/
# infrastructure-seaweedfs-runtime.yaml for why, and for the incident that
# made the split necessary.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
