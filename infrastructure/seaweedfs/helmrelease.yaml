# Chart version re-verified against
# https://seaweedfs.github.io/seaweedfs-operator/index.yaml as of 2026-08-10:
# latest is 0.1.37 (appVersion 1.0.34).
#
# This chart's CRDs carry `helm.sh/resource-policy: keep` (confirmed via
# `helm template`) — unlike every other chart in this repo, a Flux-driven
# uninstall will not remove them. Deliberate on the operator's part (deleting
# CRDs deletes every instance's data), but it means offboarding SeaweedFS
# entirely needs a manual `kubectl delete crd` afterwards.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs
spec:
  interval: 30m
  chart:
    spec:
      chart: seaweedfs-operator
      version: "0.1.37"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
  values:
    # Restated at the chart's own defaults, same reasoning as kro's
    # HelmRelease: keeps the platform's footprint (CONCEPT.md S10) visible in
    # git rather than moving silently on a chart bump.
    resources:
      requests: { cpu: 100m, memory: 50Mi }
      limits: { cpu: 500m, memory: 500Mi }
