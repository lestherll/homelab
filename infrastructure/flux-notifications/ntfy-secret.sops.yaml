# The ntfy endpoint the Flux notification-controller posts to, and the headers
# it posts with.
#
# THIRD copy of this topic, and the reason is the same boundary problem each
# time: the host watchdog reads it from Ansible group_vars, Alertmanager reads
# it from a Secret in `observability`, and Flux's Provider must read it from a
# Secret in its OWN namespace — a Provider cannot reference a Secret in another
# namespace, by design. Rotating the topic means editing THREE files:
#   ansible/inventory/group_vars/homelab/ntfy_topic.sops.yaml
#   infrastructure/observability/alertmanager-ntfy-secret.sops.yaml
#   this file
# Named here rather than left to be discovered by a rotation that half-works.
#
# Consolidating is a real option if this ever grows a fourth consumer — a
# reflector copying one source Secret across namespaces — but at three copies
# of a value that changes approximately never, the controller would cost more
# than it saves.
