# Points at a *different* git repo (personal-finance-dashboard's own), not
# this one — the app's manifests live entirely there (deploy/); this file is
# just the pointer, kept minimal on purpose (see
# gitrepository-personal-finance-dashboard.yaml for the source registration).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: personal-finance-dashboard
  namespace: flux-system
  annotations:
    # Being handed off to the app repo's own CI (LES-55) — and this object has
    # `prune: true`, so garbage-collecting it would take the app's workloads
    # with it. See gitrepository-fastapi-echo.yaml for the full rationale.
    # TEMPORARY — strip once the app repo's CI owns the object.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: personal-finance-dashboard
