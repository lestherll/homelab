# Chart version re-verified against https://pkgs.tailscale.com/helmcharts/index.yaml
# as of 2026-08-09: 1.98.9.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  values:
    # No fullnameOverride: confirmed against the live Deployment (kubectl get
    # deployment -n tailscale -o yaml) that this chart doesn't honor it — every
    # resource renders under the plain name "operator" regardless.
    #
    # No `oauth:` block on purpose: the chart falls back to a pre-created
    # Secret, hardcoded name "operator-oauth" (confirmed against the live
    # Deployment's volume spec, not derived from fullname), which
    # oauth-secret.sops.yaml provides — keeps the credential decoupled from
    # this release's lifecycle rather than passed through Helm values.
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
