# Chart version re-verified against https://cloudnative-pg.io/charts/index.yaml
# as of 2026-08-09: 0.29.0 (appVersion 1.30.0).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    # Scaled to 0, 2026-10-22: the operator is genuinely BestEffort (chart
    # default `resources: {}`, no requests/limits at all), which made it one
    # of Talos's OOM controller's first picks during today's node-wide memory
    # pressure (~9 SIGKILLs in one day, talosctl dmesg). The only live
    # Database instance is d20-smoke's smoke-db — a smoke test, not a real
    # app — so it isn't worth giving this a resources block to keep it
    # running. Its Cluster/pod keep running unmanaged while this is 0; set
    # back to 1 (the chart default) once a real app needs the operator again.
    replicaCount: 0
