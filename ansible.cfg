[defaults]
inventory = ansible/inventory/hosts.ini
roles_path = ansible/roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
# Ubuntu 26.04 defaults to sudo-rs, which wraps any -p prompt text inside its
# own "[sudo: ...] Password:" format instead of replacing it outright — no
# flag combination makes Ansible's prompt-detection regex match that (upstream:
# https://github.com/ansible/ansible/issues/85837, closed wontfix at
# https://github.com/trifectatechfoundation/sudo-rs/issues/1461). Workaround:
# skip prompt detection entirely. Run `sudo -v` in the same terminal right
# before ansible-playbook to cache a sudo timestamp, then -n here makes sudo
# use that cached ticket non-interactively — succeeds immediately with no
# prompt to misparse, or fails fast (not a hang) if the cache has expired.
become_flags = -H -n
