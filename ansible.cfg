[defaults]
inventory = ansible/inventory/hosts.ini
roles_path = ansible/roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
# host_group_vars is the default plugin for group_vars/host_vars loading;
# community.sops.sops adds transparent decryption for *.sops.yaml files
# within those directories (age key: ~/.config/sops/age/keys.txt). Listing
# vars_plugins_enabled at all replaces the default set, so both must be named.
vars_plugins_enabled = host_group_vars, community.sops.sops

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
# Ubuntu 26.04 defaults to sudo-rs, which WRAPS Ansible's -p marker inside its
# own "[sudo: <marker>] Password:" rather than replacing it. Ansible matches
# the prompt with startswith(), so a string beginning "[sudo:" can never match
# and become hangs until it times out. Observed directly on this host,
# 2026-08-30:
#
#   $ echo 'wrong' | sudo -S -v
#   [sudo: authenticate] Password:
#
#   $ ANSIBLE_BECOME_FLAGS='-H -S' ansible ... -m ping -K
#   Timed out waiting for become success or become password prompt.
#   >>> [sudo: [sudo via ansible, key=...] password:] Password:
#
# Upstream state, checked 2026-08-30 — note this is NOT deadlocked, and an
# earlier version of this comment said so incorrectly:
#   - ansible/ansible#85837 is CLOSED COMPLETED; PR #86175 (639bab6, merged
#     2026-04-27) adds a check_password_prompt() override that retries the
#     match against the wrapped form.
#   - trifectatechfoundation/sudo-rs#1461 is OPEN. The wrapping is a deliberate
#     design choice — sudo-rs will not hide PAM's prompt, since PAM may be
#     asking for a PIN or a TOTP code rather than a password.
#   - The fix is UNRELEASED. It is in devel only: absent from v2.21.3 and from
#     stable-2.21, and there is no 2.22 tag yet. It merged one day before
#     v2.21.0rc1 was cut, after stable-2.21 had already branched.
#
# So no released ansible-core can do password-based become against sudo-rs.
# Two things would have to be true and neither is: sudo needs -S or a TTY
# (-S does work on sudo-rs 0.2.13), AND Ansible must parse the wrapped prompt.
#
# Workaround while the inventory is still connection=local: skip prompt
# detection entirely. Run `sudo -v` in the same terminal right before
# ansible-playbook to cache a sudo timestamp, then -n here makes sudo use that
# cached ticket non-interactively — succeeds immediately with no prompt to
# misparse, or fails fast (not a hang) if the cache has expired.
#
# That ticket is per-tty and does NOT survive SSH, so this whole mechanism is
# replaced by a NOPASSWD sudoers drop-in planted at OS-install time when the
# fleet goes remote — see docs/fleet/fleet-provisioning-design-notes.md §2. Keep -n
# after that: it makes a MISSING drop-in fail fast rather than hang on a prompt
# nobody will answer. Keep -H too; dropping it changes $HOME for the escalated
# user, which is an unrelated behaviour change.
become_flags = -H -n
