# Separate from the root `infrastructure` Kustomization for the same reason
# infrastructure-seaweedfs-runtime.yaml is — see that file for the full
# writeup of the deadlock.
#
# Short version: infrastructure/tailscale-runtime/ holds a raw ProxyGroup
# manifest whose CRD is installed by the tailscale-operator HelmRelease in
# infrastructure/tailscale-operator/, which is itself only applied BY the root
# `infrastructure` Kustomization. kustomize-controller dry-run-validates every
# manifest's GVK before applying anything, so on a cold cluster this manifest
# would fail validation and take the ENTIRE infrastructure Kustomization down
# with it — including the HelmRelease that installs the very CRD it needs.
#
# The ProxyGroup deliberately does NOT live next to the HelmRelease that
# provides its CRD, even though they are the same component conceptually.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-tailscale-runtime
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/tailscale-runtime
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
